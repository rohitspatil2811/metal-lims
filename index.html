function downloadTRFWord(labNumber){
  const s = DB.samples[labNumber];
  if(!s) return;
  const html = buildTRFWordHTML(s);
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${labNumber}-TRF.doc`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function tensileRawFieldsForType(areaType){
  if(areaType==="hollow") return [["outerDia","Outer dia., orig. (mm)"],["innerDia","Inner dia., orig. (mm)"],["finalOuterDia","Outer dia., final (mm)"],["finalInnerDia","Inner dia., final (mm)"]];
  if(areaType==="flat") return [["width","Width, orig. (mm)"],["thickness","Thickness, orig. (mm)"],["finalWidth","Width, final (mm)"],["finalThickness","Thickness, final (mm)"]];
  if(areaType==="manual") return [["area0Manual","Area, orig. (mm²)"],["areaFManual","Area, final (mm²)"]];
  return [["diameter","Diameter, orig. (mm)"],["finalDiameter","Diameter, final (mm)"]];
}
/* Transposed comparison table: one column per specimen (at least 4 recommended),
   properties as rows, Requirement as the final column — the format for reporting
   multiple test pieces from one sample side by side. */
function specimenHasData(sp){
  return ["diameter","finalDiameter","outerDia","innerDia","finalOuterDia","finalInnerDia","width","thickness","finalWidth","finalThickness","area0Manual","areaFManual","gaugeLength","finalGaugeLength","yieldLoad","ultimateLoad","hardness"].some(f=>sp[f]!==undefined && sp[f]!=="");
}
function tensileComparisonTable(s, forWord){
  const specs = (s.mechanical.specimens||[]).filter(specimenHasData);
  if(specs.length===0) return "";
  const calcs = specs.map(calcSpecimen);
  const areaTypesUsed = Array.from(new Set(specs.map(sp=>sp.areaType||"round")));
  const rawFieldSet = areaTypesUsed.length===1 ? tensileRawFieldsForType(areaTypesUsed[0]) : tensileRawFieldsForType("round");
  const rows = [];
  rawFieldSet.forEach(([field,label])=>{
    rows.push({label, values: specs.map(sp=>esc(sp[field])||"—"), req:""});
  });
  rows.push({label:"Cross-sectional area, orig. (mm²)", values: calcs.map(c=>c.area0!==null?fmt(c.area0):"—"), req:""});
  rows.push({label:"Gauge length, orig. (mm)", values: specs.map(sp=>esc(sp.gaugeLength)||"—"), req:""});
  rows.push({label:"Gauge length, final (mm)", values: specs.map(sp=>esc(sp.finalGaugeLength)||"—"), req:""});
  rows.push({label:"Yield load (N)", values: specs.map(sp=>esc(sp.yieldLoad)||"—"), req:""});
  rows.push({label:"Ultimate load (N)", values: specs.map(sp=>esc(sp.ultimateLoad)||"—"), req:""});
  rows.push({label:"Yield strength (MPa)", values: calcs.map(c=>c.YS!==null?fmt(c.YS):"—"), req: specs[0].yieldReq||"—", raw: calcs.map(c=>c.YS)});
  rows.push({label:"Tensile strength (MPa)", values: calcs.map(c=>c.UTS!==null?fmt(c.UTS):"—"), req: specs[0].utsReq||"—", raw: calcs.map(c=>c.UTS)});
  rows.push({label:"Elongation (%)", values: calcs.map(c=>c.elong!==null?fmt(c.elong,1):"—"), req: specs[0].elongReq||"—", raw: calcs.map(c=>c.elong)});
  rows.push({label:"Fracture location", values: specs.map(sp=>esc(sp.fractureLocation)||"—"), req:""});
  rows.push({label:"Reduction of area (%)", values: calcs.map(c=>c.RA!==null?fmt(c.RA,1):"—"), req: specs[0].raReq||"—", raw: calcs.map(c=>c.RA)});
  // Note: hardness is intentionally NOT a row here — it prints under its own separate
  // "Hardness Test" heading (see embeddedHardnessFromTensile in the report builder),
  // not inside the Tensile Test table, per an earlier explicit request to keep them apart.

  const headCells = ["Property", ...specs.map((sp,i)=>`Specimen ${i+1}`), "Requirement"];
  if(forWord){
    const th = (t)=>`<th style="border:none;border-bottom:1.25pt solid #182228;padding:4px 8px 4px 0;font-size:8.5pt;text-align:left;font-weight:bold;">${esc(t)}</th>`;
    const td = (t)=>`<td style="border:none;border-bottom:0.5pt solid #d6dad4;padding:4px 8px 4px 0;font-size:8.5pt;">${t}</td>`;
    return `<table style="border-collapse:collapse;width:100%;margin-bottom:8px;">
      <tr>${headCells.map(th).join("")}</tr>
      ${rows.map(r=>{
        const cells = r.values.map((v,i)=>{
          const pass = r.raw ? checkConform(r.raw[i], r.req) : null;
          return td(v + (pass===true?' <b style="color:#2f6f63;">PASS</b>':pass===false?' <b style="color:#a8493f;">FAIL</b>':''));
        });
        return `<tr>${td("<b>"+esc(r.label)+"</b>")}${cells.join("")}${td(esc(r.req)||"—")}</tr>`;
      }).join("")}
    </table>`;
  }
  return `<table>
    <thead><tr>${headCells.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>
      ${rows.map(r=>{
        const cells = r.values.map((v,i)=>{
          const pass = r.raw ? checkConform(r.raw[i], r.req) : null;
          return `<td>${v}${pass===true?' <span style="color:var(--teal);font-weight:600;">✓</span>':pass===false?' <span style="color:var(--red);font-weight:700;">✕</span>':''}</td>`;
        });
        return `<tr><td>${esc(r.label)}</td>${cells.join("")}<td>${esc(r.req)||"—"}</td></tr>`;
      }).join("")}
    </tbody>
  </table>`;
}
function tensileDimensionRows(sp){
  const rows = [];
  const at = sp.areaType || "round";
  if(at === "round"){
    rows.push(["Diameter, original (mm)", esc(sp.diameter)||"—"]);
    rows.push(["Diameter, final (mm)", esc(sp.finalDiameter)||"—"]);
  } else if(at === "hollow"){
    rows.push(["Outer diameter, original (mm)", esc(sp.outerDia)||"—"]);
    rows.push(["Inner diameter, original (mm)", esc(sp.innerDia)||"—"]);
    rows.push(["Outer diameter, final (mm)", esc(sp.finalOuterDia)||"—"]);
    rows.push(["Inner diameter, final (mm)", esc(sp.finalInnerDia)||"—"]);
  } else if(at === "flat"){
    rows.push(["Width, original (mm)", esc(sp.width)||"—"]);
    rows.push(["Thickness, original (mm)", esc(sp.thickness)||"—"]);
    rows.push(["Width, final (mm)", esc(sp.finalWidth)||"—"]);
    rows.push(["Thickness, final (mm)", esc(sp.finalThickness)||"—"]);
  } else {
    rows.push(["Area, original (manual, mm²)", esc(sp.area0Manual)||"—"]);
    rows.push(["Area, final (manual, mm²)", esc(sp.areaFManual)||"—"]);
  }
  return rows;
}
function tensileGaugeLoadRows(sp){
  return [
    ["Gauge length, original (mm)", esc(sp.gaugeLength)||"—"],
    ["Gauge length, final (mm)", esc(sp.finalGaugeLength)||"—"],
    ["Yield load (N)", esc(sp.yieldLoad)||"—"],
    ["Ultimate load (N)", esc(sp.ultimateLoad)||"—"],
  ];
}
function tensileRawRows(sp){
  return [...tensileDimensionRows(sp), ...tensileGaugeLoadRows(sp)];
}
function renderReport(mode){
  mode = mode || "report";
  const isRecord = mode === "record";
  const s = DB.samples[activeLabNumber];
  if(!s){ view="dashboard"; return renderDashboard(); }
  if(!s.flattening) s.flattening = {testMethod:"ASTM A530 / ASTM A999", pieces:[]};
  if(!s.corrosionTests) s.corrosionTests = [];
  if(!s.hardnessTest) s.hardnessTest = {testMethod:"ASTM E10 / E92 / E18", specimens:[]};
  if(!s.bendTest) s.bendTest = {testMethod:"ASTM E190 / AWS D1.1 (Guided Bend Test)", specimens:[]};
  const bars = Array.from({length:38}, ()=> 1+Math.floor(Math.random()*4));

  let mechBlock="", chemBlock="", hicBlock="", corrBlock="", metaBlock="";

  /* ---- Mechanical family: Tensile, Hardness Test, Bend Test, Flattening share one Discipline/Group header ---- */
  const mechParts = [];
  const embeddedHardnessFromTensile = [];
  if(s.testsRequested.mechanical){
    const areaTypeLabel = (t)=> (AREA_TYPES.find(a=>a.id===(t||"round"))||{}).label || "Round";
    const tMethod = combineMethods(s.mechanical.tensileMethod, s.mechanical.tensileMethodsExtra) || "—";
    const filledSpecimens = s.mechanical.specimens.filter(specimenHasData);
    if(filledSpecimens.length===0){
      mechParts.push(testBlockHeader("Tensile Test", tMethod, s.mechanical.testDate, s.mechanical.tensileEquipmentId) + `<table><tbody><tr><td style="color:var(--ink-soft);">No specimen data recorded</td></tr></tbody></table>`);
    } else if(filledSpecimens.length>1){
      filledSpecimens.forEach((sp,i)=>{
        if(sp.hardness) embeddedHardnessFromTensile.push({label: `Specimen ${i+1}`, scale: sp.hardnessScale||"HB", avg: calcSpecimen(sp).avgHardness, req: sp.hardnessReq});
      });
      mechParts.push(testBlockHeader("Tensile Test — "+filledSpecimens.length+" specimens", tMethod, s.mechanical.testDate, s.mechanical.tensileEquipmentId) + tensileComparisonTable(s, false));
    } else {
      filledSpecimens.forEach((sp,i)=>{
        const c = calcSpecimen(sp);
        const rows = [
          ["Cross-section", areaTypeLabel(sp.areaType)],
          ...tensileDimensionRows(sp),
          ["Cross-sectional area, orig. (mm²)", c.area0!==null?fmt(c.area0):"—"],
          ...tensileGaugeLoadRows(sp),
          ["Yield strength", c.YS!==null?fmt(c.YS)+" MPa":"—", sp.yieldReq||"—", c.YS],
          ["Tensile strength (UTS)", c.UTS!==null?fmt(c.UTS)+" MPa":"—", sp.utsReq||"—", c.UTS],
          ["Elongation", c.elong!==null?fmt(c.elong,1)+" %":"—", sp.elongReq||"—", c.elong],
          ["Fracture location", esc(sp.fractureLocation)||"—"],
          ["Reduction of area", c.RA!==null?fmt(c.RA,1)+" %":"—", sp.raReq||"—", c.RA],
        ];
        if(sp.hardness) embeddedHardnessFromTensile.push({label: "", scale: sp.hardnessScale||"HB", avg: c.avgHardness, req: sp.hardnessReq});
        mechParts.push(testBlockHeader("Tensile Test", tMethod, s.mechanical.testDate, s.mechanical.tensileEquipmentId) + vertTable(rows));
      });
    }
  }
  if(s.testsRequested.hardnessTest || embeddedHardnessFromTensile.length>0){
    const specimens = s.hardnessTest.specimens||[];
    const hMethod = combineMethods(s.hardnessTest.testMethod, s.hardnessTest.testMethodsExtra);
    if(specimens.length===0 && embeddedHardnessFromTensile.length>0){
      embeddedHardnessFromTensile.forEach(h=>{
        const rows = [["Average ("+h.scale+")", h.avg!==null?fmt(h.avg,1):"—", h.req||"—", h.avg]];
        const label = h.label ? `Hardness Test — ${h.label}` : "Hardness Test";
        mechParts.push(testBlockHeader(label, hMethod, s.mechanical.testDate, s.mechanical.tensileEquipmentId) + vertTable(rows));
      });
    } else if(specimens.length===0){
      mechParts.push(testBlockHeader("Hardness Test", hMethod, s.hardnessTest.testDate, s.hardnessTest.equipmentId) + `<table><tbody><tr><td style="color:var(--ink-soft);">No specimens recorded</td></tr></tbody></table>`);
    } else {
      specimens.forEach((sp,i)=>{
        const c = calcHardnessSpecimen(sp);
        const rows = [
          [(sp.scale||"HB")+" Hardness Test", esc(sp.readings)||"—"],
          ["Average", c.avg!==null?fmt(c.avg,1):"—", sp.requirement||"—", c.avg],
        ];
        const label = specimens.length>1 ? `Hardness Test — ${esc(sp.label)||('Specimen '+(i+1))}` : "Hardness Test";
        mechParts.push(testBlockHeader(label, hMethod, s.hardnessTest.testDate, s.hardnessTest.equipmentId) + vertTable(rows));
      });
    }
  }
  if(s.testsRequested.bendTest){
    const specimens = s.bendTest.specimens||[];
    if(specimens.length===0){
      mechParts.push(testBlockHeader("Bend Test", combineMethods(s.bendTest.testMethod, s.bendTest.testMethodsExtra), s.bendTest.testDate, s.bendTest.equipmentId) + `<table><tbody><tr><td style="color:var(--ink-soft);">No specimens recorded</td></tr></tbody></table>`);
    } else {
      specimens.forEach((sp,i)=>{
        const rows = [
          ["Bend type", esc(sp.bendType)||"—"],
          ["Former diameter (mm)", esc(sp.formerDiameter)||"—"],
          ["Bend angle", esc(sp.bendAngle)||"—"],
          ["Observation", esc(sp.observation)||"—", sp.requirement||"—"],
          ["Result", sp.result==="Satisfactory"?'<span style="color:var(--teal);font-weight:700;">Satisfactory</span>':sp.result==="Unsatisfactory"?'<span style="color:var(--red);font-weight:700;">Unsatisfactory</span>':"—"],
        ];
        const label = specimens.length>1 ? `Bend Test — ${esc(sp.label)||('Specimen '+(i+1))}` : "Bend Test";
        mechParts.push(testBlockHeader(label, combineMethods(s.bendTest.testMethod, s.bendTest.testMethodsExtra), s.bendTest.testDate, s.bendTest.equipmentId) + vertTable(rows));
      });
    }
  }
  if(s.testsRequested.flattening){
    const pieces = s.flattening.pieces||[];
    if(pieces.length===0){
      mechParts.push(testBlockHeader("Flattening Test", combineMethods(s.flattening.testMethod, s.flattening.testMethodsExtra), s.flattening.testDate, s.flattening.equipmentId) + `<table><tbody><tr><td style="color:var(--ink-soft);">No test pieces recorded</td></tr></tbody></table>`);
    } else {
      pieces.forEach((p,i)=>{
        const rows = [
          ["Observation", esc(p.observation)||"—", p.requirement||"—"],
          ["Result", p.result==="Pass"?'<span style="color:var(--teal);font-weight:700;">Pass</span>':p.result==="Fail"?'<span style="color:var(--red);font-weight:700;">Fail</span>':"—"],
        ];
        const label = pieces.length>1 ? `Flattening Test — ${esc(p.label)||('Piece '+(i+1))}` : "Flattening Test";
        mechParts.push(testBlockHeader(label, combineMethods(s.flattening.testMethod, s.flattening.testMethodsExtra), s.flattening.testDate, s.flattening.equipmentId) + vertTable(rows));
      });
    }
  }
  if(mechParts.length){
    mechBlock = `<div class="report-section-title">Discipline : Mechanical, Group : Mechanical Properties of Metals</div>` + mechParts.join("");
  }

  /* ---- Chemical ---- */
  if(s.testsRequested.chemical){
    const tests = ensureChemicalTests(s, 4).filter(chemTestHasData);
    const first = tests[0]||{};
    chemBlock = `
    <div class="report-section-title">Discipline : Chemical, Group : Metals &amp; Alloys</div>
    ${testBlockHeader("Spectro Chemical Analysis"+(tests.length>1?" — "+tests.length+" samples":""), "", first.testDate, first.equipmentId)}
    ${chemicalComparisonTable(s, false)}`;
  }

  /* ---- HIC (classified under Corrosion) ---- */
  if(s.testsRequested.hic){
    const avg = calcHICAvg(s.hic.plates);
    const rows = [
      ["Avg. CLR", avg.avgCLR!==null?fmt(avg.avgCLR)+' %':'—'],
      ["Avg. CTR", avg.avgCTR!==null?fmt(avg.avgCTR)+' %':'—'],

    hicBlock = `

    ${vertTable(rows)}`;
  }

  /* ---- Corrosion / IGC ---- */
  if(anyCorrosionRequested(s)){
    const corrTestCounts = {};
    corrBlock = (s.corrosionTests||[]).map((t)=>{
      const tpl = CORROSION_TEMPLATES[t.template];
      if(!tpl) return "";
      corrTestCounts[t.template] = (corrTestCounts[t.template]||0)+1;
      const seq = corrTestCounts[t.template];
      const overall = corrosionTestOverallResult(t);
      let extraRows = "";
      if(tpl.massLoss){
        const c = calcMassLossCorrosion(t.values);
        const pass = checkConform(c.rate_mmpy, t.values.requirement);
        extraRows = `
          <tr><td>Mass loss</td><td>${fmt(c.massLoss,4)} g</td></tr>
          <tr><td>Corrosion rate (mm/y)</td><td>${c.rate_mmpy!==null?fmt(c.rate_mmpy,4):"—"}${pass===true?' <span style="color:var(--teal);font-weight:600;">✓</span>':pass===false?' <span style="color:var(--red);font-weight:700;">✕</span>':''}</td></tr>
          <tr><td>Corrosion rate (mpy)</td><td>${c.rate_mpy!==null?fmt(c.rate_mpy,2):"—"}</td></tr>`;
      }
      return `
      <div class="report-section-title">Discipline : Corrosion, Group : ${esc(tpl.shortLabel)}${seq>1?" (Test "+seq+")":""}</div>
      ${testBlockHeader("", "", t.values.testDate, t.values.equipmentId)}
      <table>
        <thead><tr><th>Parameter</th><th>Value</th></tr></thead>
        <tbody>
          ${tpl.fields.map(f=>`<tr><td>${esc(f.label)}</td><td>${esc(t.values[f.key])||"—"}</td></tr>`).join("")}
          ${extraRows}
          ${overall!==null ? `<tr><td><b>Overall result</b></td><td>${overall?'<span style="color:var(--teal);font-weight:700;">Satisfactory / Pass</span>':'<span style="color:var(--red);font-weight:700;">Unsatisfactory / Fail</span>'}</td></tr>` : ""}
        </tbody>
      </table>`;
    }).join("") || `<div class="report-section-title">Discipline : Corrosion</div><table><tbody><tr><td style="color:var(--ink-soft);">No corrosion / IGC tests recorded</td></tr></tbody></table>`;
  }

  /* ---- Metallography ---- */
  if(s.testsRequested.metallography){
    const m = s.metallography;
    const rows = [
      ["Grain size (ASTM)", esc(m.grainSizeASTM)||"—"],
      ["Phase / constituent %", esc(m.phasePercent)||"—"],
      ["Inclusion rating", esc(m.inclusionRating)||"—"],
      ["Observation", esc(m.microstructure)||"—"],
      ["Remarks", esc(m.remarks)||"—"],
    ];
    metaBlock = `
    <div class="report-section-title">Discipline : Mechanical, Group : Metallography Test</div>
    ${testBlockHeader("Macro / Micro Test Report", combineMethods(m.testMethod, m.testMethodsExtra), m.testDate, m.equipmentId)}
    ${vertTable(rows)}`;
  }

  /* ---- Additional / Other Tests ---- */
  let addlBlock = "";
  if(s.testsRequested.additionalTests){
    addlBlock = (s.additionalTests||[]).map(t=>{
      const ps = getParamSetForTestName(t.name);
      let rows;
      if(ps && ps.parameters && ps.parameters.length){
        if(!t.paramValues) t.paramValues = {};
        recomputeCalculatedParams(t, ps);
        rows = ps.parameters.filter(p=>!p.hide && !isVacant(t.paramValues[p.id])).map(p=>[esc(p.name)||"—", esc(t.paramValues[p.id])]);
        if(t.requirement) rows.push(["Requirement", esc(t.requirement)]);
        if(t.remarks) rows.push(["Remarks", esc(t.remarks)]);
      } else {
        rows = [
          ["Requirement", esc(t.requirement)||"—"],
          ["Result", esc(t.result)||"—", t.requirement||undefined, num(t.result)],
          ["Remarks", esc(t.remarks)||"—"],
        ];
      }
      const verdict = additionalTestConformance(t);
      if(t.verdict) rows.push(["Verdict", verdict===true?`<span style="color:var(--teal);font-weight:700;">${esc(t.verdict)}</span>`:verdict===false?`<span style="color:var(--red);font-weight:700;">${esc(t.verdict)}</span>`:esc(t.verdict)]);
      return `
      <div class="report-section-title">Discipline : ${esc(t.discipline||"Mechanical")}, Group : ${esc(t.name||"Additional Test")}</div>
      ${testBlockHeader("", combineMethods(t.testMethod, []), t.testDate, t.equipmentId)}
      ${vertTable(rows, ["Item","Value","Requirement"])}`;
    }).join("") || `<div class="report-section-title">Discipline : Other</div><table><tbody><tr><td style="color:var(--ink-soft);">No additional tests recorded</td></tr></tbody></table>`;
  }

  if(!isRecord && !s.reportDate){ s.reportDate = todayISO(); saveDB(); }
  const overallConf = sampleOverallConformance(s);
  return `
  <div class="topline no-print">
    <div><div class="page-eyebrow">${isRecord?"Test record":"Test report"}</div><h1 class="page-title">${esc(s.labNumber)}</h1></div>
    <div style="display:flex;gap:8px;">
      <button class="btn outline" data-nav="sampleDetail">Back to sample</button>
      <button class="btn outline" id="print-btn">Print / save PDF</button>
      <button class="btn outline" id="excel-btn">Download Excel (.xlsx)</button>
      <button class="btn amber" id="word-btn">Download Word (.doc)</button>
    </div>
  </div>
  <div class="report-sheet">
    <div class="report-head">
      <div>
        <div class="report-lab-name">${esc(DB.meta.labName)}</div>
        <div class="report-lab-addr">${esc(DB.meta.labAddress)||""}</div>
        <div style="font-size:12px;font-weight:700;letter-spacing:1.5px;margin-top:4px;color:var(--ink-soft);">${isRecord?"TEST RECORD":"TEST REPORT"}</div>
      </div>
      <div class="report-tag">
        <div class="cap">Lab No.</div>
        <div class="num">${esc(s.labNumber)}</div>
        ${(!isRecord && s.ulrNo) ? `<div style="margin-top:4px;font-size:11px;color:var(--ink-soft);">ULR: <span style="font-family:var(--mono);color:var(--ink);">${esc(s.ulrNo)}</span></div>` : ""}
        ${overallConf!==null ? `<div style="margin-top:4px;font-size:13px;">${conformBadge(overallConf)}</div>` : ""}
        <div class="barcode">${bars.map(h=>`<span style="height:${h*6}px;"></span>`).join("")}</div>
      </div>
    </div>

    <div style="font-size:11px;margin-bottom:6px;">
      <span style="font-weight:600;color:var(--ink-soft);">Customer Name &amp; Address:</span>
      ${esc(s.customerName)}${s.customerAddress?" — "+esc(s.customerAddress).replace(/\n/g," | "):""}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 28px;font-size:11px;margin-bottom:4px;">
      ${buildSampleInfoPairs(s, mode).map(([label,value])=>`
        <div><span style="font-weight:600;color:var(--ink-soft);">${label}:</span> ${value}</div>
      `).join("")}
    </div>

    ${mechBlock}${corrBlock}${chemBlock}${hicBlock}${metaBlock}${addlBlock}

    <div class="report-disclaimer">
      <b>Decision Rule (ISO/IEC 17025, ILAC-G8:2019):</b> Simple acceptance rule applied, i.e. Acceptance Limit (AL) = Tolerance Limit (TL) — results are
      rounded off appropriately and compared directly with the specification, without a formal guard-band for measurement uncertainty, unless stated otherwise.
    </div>
    <div class="report-disclaimer">
      <b>Measurement Uncertainty:</b> Estimated measurement uncertainty is not included in the reported results, unless specifically requested by the customer
      and stated against the relevant result.
    </div>
    <div class="report-disclaimer">
      <b>Opinions &amp; Interpretation:</b> Pass/Fail statements shown against individual results are the laboratory's opinion, formed by comparing the
      measured result with the stated requirement per the Decision Rule above.
    </div>
    ${!isRecord ? `<div class="report-disclaimer"><b>Page:</b> 1 of 1</div>` : ""}
    <div class="report-disclaimer">
      <b>Disclaimer:</b> 1. Sample drawn by customer, and the test results apply only to the sample as received. 2. The results relate solely to the tested item.
      No endorsement of the product is inferred or implied. This certificate shall not be reproduced, in whole or in part, without prior written approval.
      3. The total liability of the laboratory is limited to the invoiced amount for the testing services provided. 4. Any complaints regarding this test report
      must be submitted in writing within seven (7) days from the date of issuance. 5. Information provided by the customer may affect the validity of results.
    </div>
    <div class="report-endline">. . . . . . . . . . . . ${isRecord?"END OF RECORD":"END OF REPORT"} . . . . . . . . . . . .</div>

    <div class="report-sign">
      <div class="sign-line">Checked By<br><span style="font-size:9px;">Name: ______________&nbsp;&nbsp;Date: __________</span></div>
      <div class="sign-line">Reviewed &amp; Authorised By<br><span style="font-size:9px;">Name: ______________&nbsp;&nbsp;Date: __________</span></div>
    </div>
  </div>`;
}

/* ===================== WORD (.doc) EXPORT ===================== */
function wordTestBlockHeader(name, method, date, equipmentId){
  const eq = equipmentReportLine(equipmentId);
  const parts = [];
  if(name) parts.push(`<b>${esc(name)}</b>`);
  if(method) parts.push(`Test Method : <b>${esc(method)}</b>`);
  if(date) parts.push(`Test Date : <b>${esc(date)}</b>`);
  const headerLine = parts.length ? `<p style="font-size:9.5pt;margin:10px 0 2px 0;">${parts.join("&nbsp;&nbsp;&nbsp;")}</p>` : "";
  const eqLine = eq ? `<p style="font-size:8pt;color:#555;margin:0 0 4px 0;">${eq}</p>` : "";
  return headerLine + eqLine;
}
function buildWordHTML(s, mode){
  mode = mode || "report";
  const isRecord = mode === "record";
  if(!s.flattening) s.flattening = {testMethod:"ASTM A530 / ASTM A999", pieces:[]};
  if(!s.corrosionTests) s.corrosionTests = [];
  if(!s.hardnessTest) s.hardnessTest = {testMethod:"ASTM E10 / E92 / E18", specimens:[]};
  if(!s.bendTest) s.bendTest = {testMethod:"ASTM E190 / AWS D1.1 (Guided Bend Test)", specimens:[]};
  const W = (label,val)=>`<tr><td style="padding:3px 10px 3px 0;font-weight:bold;width:35%;border:none;border-bottom:0.5pt solid #e3e7e2;vertical-align:top;">${esc(label)}</td><td style="padding:3px 0;border:none;border-bottom:0.5pt solid #e3e7e2;">${val}</td></tr>`;
  const sectionTitle = (t)=>`<h3 style="font-size:10.5pt;text-transform:uppercase;letter-spacing:1px;color:#333;border-bottom:1.5pt solid #182228;padding-bottom:2px;margin:12px 0 4px 0;">${esc(t)}</h3>`;
  const th = (t)=>`<th style="border:none;border-bottom:1.25pt solid #182228;padding:4px 8px 4px 0;font-size:8.5pt;text-align:left;font-weight:bold;">${esc(t)}</th>`;
  const td = (t)=>`<td style="border:none;border-bottom:0.5pt solid #d6dad4;padding:4px 8px 4px 0;font-size:8.5pt;">${t}</td>`;
  const wVertTable = (rows, headers)=>{
    headers = headers || ["Test Parameter","Result","Requirement"];
    rows = rows.filter(r=>!isVacant(r[1]));
    if(!rows.length) return `<p style="font-size:9.5pt;color:#555;">No data recorded</p>`;
    const hasReq = rows.some(r=>r.length>=3 && r[2]!==undefined);
    const cols = hasReq ? headers : headers.slice(0,2);
    return `<table style="border-collapse:collapse;width:100%;margin-bottom:8px;">
      <tr>${cols.map(h=>th(h)).join("")}</tr>
      ${rows.map(r=>{
        const [label,val,req,rawVal] = r;
        const pass = (req!==undefined && req && req!=="—") ? checkConform(rawVal, req) : null;
        let tds = td(esc(label))+td(val);
        if(hasReq) tds += td((req!==undefined?(esc(req)||"—"):"")+(pass===true?' <b style="color:#2f6f63;">PASS</b>':pass===false?' <b style="color:#a8493f;">FAIL</b>':''));
        return `<tr>${tds}</tr>`;
      }).join("")}
    </table>`;
  };

  let mech="", chem="", hic="", corr="", metallo="";

  const mechParts = [];
  const embeddedHardnessFromTensile = [];
  if(s.testsRequested.mechanical){
    const areaTypeLabel = (t)=> (AREA_TYPES.find(a=>a.id===(t||"round"))||{}).label || "Round";
    const tMethod = combineMethods(s.mechanical.tensileMethod, s.mechanical.tensileMethodsExtra) || "—";
    const filledSpecimensW = s.mechanical.specimens.filter(specimenHasData);
    if(filledSpecimensW.length===0){
      mechParts.push(wordTestBlockHeader("Tensile Test", tMethod, s.mechanical.testDate, s.mechanical.tensileEquipmentId) + `<p style="font-size:9.5pt;color:#555;">No specimen data recorded</p>`);
    } else if(filledSpecimensW.length>1){
      filledSpecimensW.forEach((sp,i)=>{
        if(sp.hardness) embeddedHardnessFromTensile.push({label: `Specimen ${i+1}`, scale: sp.hardnessScale||"HB", avg: calcSpecimen(sp).avgHardness, req: sp.hardnessReq});
      });
      mechParts.push(wordTestBlockHeader("Tensile Test — "+filledSpecimensW.length+" specimens", tMethod, s.mechanical.testDate, s.mechanical.tensileEquipmentId) + tensileComparisonTable(s, true));
    } else {
      filledSpecimensW.forEach((sp,i)=>{
        const c = calcSpecimen(sp);
        const rows = [
          ["Cross-section", areaTypeLabel(sp.areaType)],
          ...tensileDimensionRows(sp),
          ["Cross-sectional area, orig. (mm²)", c.area0!==null?fmt(c.area0):"—"],
          ...tensileGaugeLoadRows(sp),
          ["Yield strength", c.YS!==null?fmt(c.YS)+" MPa":"—", sp.yieldReq||"—", c.YS],
          ["Tensile strength (UTS)", c.UTS!==null?fmt(c.UTS)+" MPa":"—", sp.utsReq||"—", c.UTS],
          ["Elongation", c.elong!==null?fmt(c.elong,1)+" %":"—", sp.elongReq||"—", c.elong],
          ["Fracture location", esc(sp.fractureLocation)||"—"],
          ["Reduction of area", c.RA!==null?fmt(c.RA,1)+" %":"—", sp.raReq||"—", c.RA],
        ];
        if(sp.hardness) embeddedHardnessFromTensile.push({label: "", scale: sp.hardnessScale||"HB", avg: c.avgHardness, req: sp.hardnessReq});
        mechParts.push(wordTestBlockHeader("Tensile Test", tMethod, s.mechanical.testDate, s.mechanical.tensileEquipmentId) + wVertTable(rows));
      });
    }
  }
  if(s.testsRequested.hardnessTest || embeddedHardnessFromTensile.length>0){
    const specimens = s.hardnessTest.specimens||[];
    const hMethod = combineMethods(s.hardnessTest.testMethod, s.hardnessTest.testMethodsExtra);
    if(specimens.length===0 && embeddedHardnessFromTensile.length>0){
      embeddedHardnessFromTensile.forEach(h=>{
        const rows = [["Average ("+h.scale+")", h.avg!==null?fmt(h.avg,1):"—", h.req||"—", h.avg]];
        const label = h.label ? `Hardness Test — ${h.label}` : "Hardness Test";
        mechParts.push(wordTestBlockHeader(label, hMethod, s.mechanical.testDate, s.mechanical.tensileEquipmentId) + wVertTable(rows));
      });
    } else if(specimens.length===0){
      mechParts.push(wordTestBlockHeader("Hardness Test", hMethod, s.hardnessTest.testDate, s.hardnessTest.equipmentId) + `<p style="font-size:9.5pt;color:#555;">No specimens recorded</p>`);
    } else {
      specimens.forEach((sp,i)=>{
        const c = calcHardnessSpecimen(sp);
        const rows = [
          [(sp.scale||"HB")+" Hardness Test", esc(sp.readings)||"—"],
          ["Average", c.avg!==null?fmt(c.avg,1):"—", sp.requirement||"—", c.avg],
        ];
        const label = specimens.length>1 ? `Hardness Test — ${esc(sp.label)||('Specimen '+(i+1))}` : "Hardness Test";
        mechParts.push(wordTestBlockHeader(label, hMethod, s.hardnessTest.testDate, s.hardnessTest.equipmentId) + wVertTable(rows));
      });
    }
  }
  if(s.testsRequested.bendTest){
    const specimens = s.bendTest.specimens||[];
    if(specimens.length===0){
      mechParts.push(wordTestBlockHeader("Bend Test", combineMethods(s.bendTest.testMethod, s.bendTest.testMethodsExtra), s.bendTest.testDate, s.bendTest.equipmentId) + `<p style="font-size:9.5pt;color:#555;">No specimens recorded</p>`);
    } else {
      specimens.forEach((sp,i)=>{
        const rows = [
          ["Bend type", esc(sp.bendType)||"—"],
          ["Former diameter (mm)", esc(sp.formerDiameter)||"—"],
          ["Bend angle", esc(sp.bendAngle)||"—"],
          ["Observation", esc(sp.observation)||"—", sp.requirement||"—"],
          ["Result", sp.result==="Satisfactory"?'<b style="color:#2f6f63;">SATISFACTORY</b>':sp.result==="Unsatisfactory"?'<b style="color:#a8493f;">UNSATISFACTORY</b>':"—"],
        ];
        const label = specimens.length>1 ? `Bend Test — ${esc(sp.label)||('Specimen '+(i+1))}` : "Bend Test";
        mechParts.push(wordTestBlockHeader(label, combineMethods(s.bendTest.testMethod, s.bendTest.testMethodsExtra), s.bendTest.testDate, s.bendTest.equipmentId) + wVertTable(rows));
      });
    }
  }
  if(s.testsRequested.flattening){
    const pieces = s.flattening.pieces||[];
    if(pieces.length===0){
      mechParts.push(wordTestBlockHeader("Flattening Test", combineMethods(s.flattening.testMethod, s.flattening.testMethodsExtra), s.flattening.testDate, s.flattening.equipmentId) + `<p style="font-size:9.5pt;color:#555;">No test pieces recorded</p>`);
    } else {
      pieces.forEach((p,i)=>{
        const rows = [
          ["Observation", esc(p.observation)||"—", p.requirement||"—"],
          ["Result", p.result==="Pass"?'<b style="color:#2f6f63;">PASS</b>':p.result==="Fail"?'<b style="color:#a8493f;">FAIL</b>':"—"],
        ];
        const label = pieces.length>1 ? `Flattening Test — ${esc(p.label)||('Piece '+(i+1))}` : "Flattening Test";
        mechParts.push(wordTestBlockHeader(label, combineMethods(s.flattening.testMethod, s.flattening.testMethodsExtra), s.flattening.testDate, s.flattening.equipmentId) + wVertTable(rows));
      });
    }
  }
  if(mechParts.length){
    mech = sectionTitle("Discipline : Mechanical, Group : Mechanical Properties of Metals") + mechParts.join("");
  }

  if(s.testsRequested.chemical){
    const tests = ensureChemicalTests(s, 4).filter(chemTestHasData);
    const first = tests[0]||{};
    chem = sectionTitle("Discipline : Chemical, Group : Metals & Alloys")
      + wordTestBlockHeader("Spectro Chemical Analysis"+(tests.length>1?" — "+tests.length+" samples":""), "", first.testDate, first.equipmentId)
      + chemicalComparisonTable(s, true)
      + `<p style="font-size:8.5pt;color:#555;">CE = C + Mn/6 + (Cr+Mo+V)/5 + (Ni+Cu)/15</p>`;
  }
  if(s.testsRequested.hic){
    const avg = calcHICAvg(s.hic.plates);
    const rows = [
      ["Avg. CLR", avg.avgCLR!==null?fmt(avg.avgCLR)+' %':'—'],
      ["Avg. CTR", avg.avgCTR!==null?fmt(avg.avgCTR)+' %':'—'],
      ["Avg. CSR", avg.avgCSR!==null?fmt(avg.avgCSR)+' %':'—'],
      ["Sections tested", String(s.hic.plates.length)],
    ];
    hic = sectionTitle("Discipline : Corrosion, Group : HIC Test")
      + wordTestBlockHeader("HIC Test", combineMethods(s.hic.testMethod, s.hic.testMethodsExtra), s.hic.testDate, s.hic.equipmentId)
      + wVertTable(rows);
  }
  if(anyCorrosionRequested(s)){
    const corrTestCountsW = {};
    corr = (s.corrosionTests||[]).map((t)=>{
      const tpl = CORROSION_TEMPLATES[t.template];
      if(!tpl) return "";
      corrTestCountsW[t.template] = (corrTestCountsW[t.template]||0)+1;
      const seq = corrTestCountsW[t.template];
      const overall = corrosionTestOverallResult(t);
      let extraRows = "";
      if(tpl.massLoss){
        const c = calcMassLossCorrosion(t.values);
        const pass = checkConform(c.rate_mmpy, t.values.requirement);
        extraRows = W("Mass loss", fmt(c.massLoss,4)+" g")
          + W("Corrosion rate (mm/y)", (c.rate_mmpy!==null?fmt(c.rate_mmpy,4):"—")+(pass===true?' <b style="color:#2f6f63;">PASS</b>':pass===false?' <b style="color:#a8493f;">FAIL</b>':''))
          + W("Corrosion rate (mpy)", c.rate_mpy!==null?fmt(c.rate_mpy,2):"—");
      }
      return sectionTitle("Discipline : Corrosion, Group : "+tpl.shortLabel+(seq>1?" (Test "+seq+")":""))
        + wordTestBlockHeader("", "", t.values.testDate, t.values.equipmentId) + `
        <table style="border-collapse:collapse;width:100%;margin-bottom:8px;">
          ${tpl.fields.map(f=>W(f.label, esc(t.values[f.key])||"—")).join("")}
          ${extraRows}
          ${overall!==null ? W("Overall result", overall?'<b style="color:#2f6f63;">Satisfactory / Pass</b>':'<b style="color:#a8493f;">Unsatisfactory / Fail</b>') : ""}
        </table>`;
    }).join("") || (anyCorrosionRequested(s) ? sectionTitle("Discipline : Corrosion") + `<p style="font-size:9.5pt;color:#555;">No corrosion / IGC tests recorded</p>` : "");
  }
  if(s.testsRequested.metallography){
    const m = s.metallography;
    const rows = [
      ["Grain size (ASTM)", esc(m.grainSizeASTM)||"—"],
      ["Phase / constituent %", esc(m.phasePercent)||"—"],
      ["Inclusion rating", esc(m.inclusionRating)||"—"],
      ["Observation", esc(m.microstructure)||"—"],
      ["Remarks", esc(m.remarks)||"—"],
    ];
    metallo = sectionTitle("Discipline : Mechanical, Group : Metallography Test")
      + wordTestBlockHeader("Macro / Micro Test Report", combineMethods(m.testMethod, m.testMethodsExtra), m.testDate, m.equipmentId)
      + wVertTable(rows);
  }

  let addl = "";
  if(s.testsRequested.additionalTests){
    addl = (s.additionalTests||[]).map(t=>{
      const ps = getParamSetForTestName(t.name);
      let rows;
      if(ps && ps.parameters && ps.parameters.length){
        if(!t.paramValues) t.paramValues = {};
        recomputeCalculatedParams(t, ps);
        rows = ps.parameters.filter(p=>!p.hide && !isVacant(t.paramValues[p.id])).map(p=>[esc(p.name)||"—", esc(t.paramValues[p.id])]);
        if(t.requirement) rows.push(["Requirement", esc(t.requirement)]);
        if(t.remarks) rows.push(["Remarks", esc(t.remarks)]);
      } else {
        rows = [
          ["Requirement", esc(t.requirement)||"—"],
          ["Result", esc(t.result)||"—", t.requirement||undefined, num(t.result)],
          ["Remarks", esc(t.remarks)||"—"],
        ];
      }
      const verdict = additionalTestConformance(t);
      if(t.verdict) rows.push(["Verdict", verdict===true?`<b style="color:#2f6f63;">${esc(t.verdict)}</b>`:verdict===false?`<b style="color:#a8493f;">${esc(t.verdict)}</b>`:esc(t.verdict)]);
      return sectionTitle("Discipline : "+(t.discipline||"Mechanical")+", Group : "+(t.name||"Additional Test"))
        + wordTestBlockHeader("", combineMethods(t.testMethod, []), t.testDate, t.equipmentId)
        + wVertTable(rows, ["Item","Value","Requirement"]);
    }).join("") || (s.testsRequested.additionalTests ? sectionTitle("Discipline : Other") + `<p style="font-size:9.5pt;color:#555;">No additional tests recorded</p>` : "");
  }

  return `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>${esc(s.labNumber)}</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
  <style>

function downloadWordReport(labNumber, mode){
  const s = DB.samples[labNumber];
  if(!s) return;
  const isRecord = mode === "record";
  const html = buildWordHTML(s, mode);
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${labNumber}-${isRecord?"record":"report"}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ===================== EXCEL (.xlsx) REPORT EXPORT =====================
   Reads the already-rendered report DOM (same content the Word/Print
   exports use) row by row into a worksheet, so it automatically covers
   every test type without needing separate logic to be kept in sync. */
function reportSheetToRows(sheetEl){
  const cellText = (el)=>{
    const ctrl = el.querySelector && el.querySelector("input,select,textarea");
    if(ctrl) return String(ctrl.value||"").trim();
    return (el.innerText||"").trim();
  };
  const rows = [];
  Array.from(sheetEl.children).forEach(el=>{
    if(el.classList.contains("no-print")) return;
    if(el.tagName === "TABLE"){
      Array.from(el.querySelectorAll("tr")).forEach(tr=>{
        rows.push(Array.from(tr.children).filter(td=>!td.classList.contains("no-print")).map(td=>cellText(td)));
      });
      rows.push([]);
    } else if(el.classList.contains("report-head")){
      el.innerText.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>rows.push([l]));
      rows.push([]);
    } else if(el.classList.contains("report-sign")){
      rows.push(el.innerText.split("\n").map(l=>l.trim()).filter(Boolean));
    } else {
      const ta = el.querySelector && el.querySelector("textarea");
      if(ta){
        if(ta.value.trim()) rows.push([ta.value.trim()]);
      } else {
        const txt = (el.innerText||"").trim();
        if(txt) rows.push([txt]);
      }
    }
  });
  return rows;
}
function downloadExcelReport(labNumber, mode){
  const s = DB.samples[labNumber];
  if(!s) return;
  const isRecord = mode === "record";
  if(typeof XLSX === "undefined"){
    flash = {type:"err", msg:"The Excel export library is still loading — please wait a moment and try again."};
    render();
    return;
  }
  const sheetEl = document.querySelector(".report-sheet");
  if(!sheetEl) return;
  const rows = reportSheetToRows(sheetEl);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:34},{wch:22},{wch:22},{wch:22}];
  const wbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wbook, ws, isRecord?"Test Record":"Test Report");
  XLSX.writeFile(wbook, `${labNumber}-${isRecord?"record":"report"}.xlsx`);
}

      s.corrosionTests.filter(t=>t.template===templateKey).forEach(t=>{ t.values.testDate = dateAll.value; });
      await saveDB(); render();
    });
    const equipAll = document.querySelector("[data-corrtest-equip-all]");
    if(equipAll) equipAll.addEventListener("change", async ()=>{
      s.corrosionTests.filter(t=>t.template===templateKey).forEach(t=>{ t.values.equipmentId = equipAll.value; });
      await saveDB(); render();
    });
  }

  if(activeSampleTab==="metallography"){
    document.querySelectorAll("[data-meta-field]").forEach(el=>{
      el.addEventListener("change", ()=>{ s.metallography[el.getAttribute("data-meta-field")] = el.value; });
    });
    const save = document.getElementById("meta-save");
    if(save) save.onclick = async ()=>{ await saveDB(); flash={type:"ok",msg:"Metallography data saved."}; render(); };
  }

  if(activeSampleTab==="flattening"){
    document.querySelectorAll("[data-flat-meta-field]").forEach(el=>{
      el.addEventListener("change", async ()=>{
        s.flattening[el.getAttribute("data-flat-meta-field")] = el.value;
        await saveDB();
      });
    });
    const addBtn = document.getElementById("flat-add");
    if(addBtn) addBtn.onclick = async ()=>{
      s.flattening.pieces.push({id:uid(), label:"", requirement:"No cracks or splits observed", observation:"", result:""});
      await saveDB(); render();
    };
    document.querySelectorAll("[data-flat-del]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const id = el.getAttribute("data-flat-del");
        s.flattening.pieces = s.flattening.pieces.filter(p=>p.id!==id);
        await saveDB(); render();
      });
    });
    document.querySelectorAll("[data-flat-field]").forEach(el=>{
      el.addEventListener("change", async ()=>{
        const id = el.getAttribute("data-flat-id");
        const field = el.getAttribute("data-flat-field");
        const p = s.flattening.pieces.find(x=>x.id===id);
        if(p){ p[field] = el.value; await saveDB(); render(); }
      });
    });
  }

  if(activeSampleTab==="hardnessTest"){
    document.querySelectorAll("[data-hardness-meta-field]").forEach(el=>{
      el.addEventListener("change", async ()=>{
        s.hardnessTest[el.getAttribute("data-hardness-meta-field")] = el.value;
        await saveDB();
      });
    });
    const addBtn = document.getElementById("hardness-add");
    if(addBtn) addBtn.onclick = async ()=>{
      s.hardnessTest.specimens.push(newHardnessSpecimen());
      await saveDB(); render();
    };
    document.querySelectorAll("[data-hardness-del]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const id = el.getAttribute("data-hardness-del");
        s.hardnessTest.specimens = s.hardnessTest.specimens.filter(p=>p.id!==id);
        await saveDB(); render();
      });
    });
    document.querySelectorAll("[data-hardness-field]").forEach(el=>{
      el.addEventListener("change", async ()=>{
        const id = el.getAttribute("data-hardness-id");
        const field = el.getAttribute("data-hardness-field");
        const p = s.hardnessTest.specimens.find(x=>x.id===id);
        if(p){ p[field] = el.value; await saveDB(); render(); }
      });
    });
  }

  if(activeSampleTab==="bendTest"){
    document.querySelectorAll("[data-bend-meta-field]").forEach(el=>{
      el.addEventListener("change", async ()=>{
        s.bendTest[el.getAttribute("data-bend-meta-field")] = el.value;
        await saveDB();
      });
    });
    const addBtn = document.getElementById("bend-add");
    if(addBtn) addBtn.onclick = async ()=>{
      s.bendTest.specimens.push(newBendSpecimen());
      await saveDB(); render();
    };
    document.querySelectorAll("[data-bend-del]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const id = el.getAttribute("data-bend-del");
        s.bendTest.specimens = s.bendTest.specimens.filter(p=>p.id!==id);
        await saveDB(); render();
      });
    });
    document.querySelectorAll("[data-bend-field]").forEach(el=>{
      el.addEventListener("change", async ()=>{
        const id = el.getAttribute("data-bend-id");
        const field = el.getAttribute("data-bend-field");
        const p = s.bendTest.specimens.find(x=>x.id===id);
        if(p){ p[field] = el.value; await saveDB(); render(); }
      });
    });
  }

  if(activeSampleTab==="additionalTests"){
    if(!s.additionalTests) s.additionalTests = [];
    const addBtn = document.getElementById("addl-add");
    if(addBtn) addBtn.onclick = async ()=>{
      s.additionalTests.push(blankAdditionalTest());
      await saveDB(); render();
    };
    document.querySelectorAll("[data-addl-del]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const id = el.getAttribute("data-addl-del");
        s.additionalTests = s.additionalTests.filter(t=>t.id!==id);
        await saveDB(); render();
      });
    });
    document.querySelectorAll("[data-addl-field]").forEach(el=>{
      el.addEventListener("change", async ()=>{
        const id = el.getAttribute("data-addl-id");
        const field = el.getAttribute("data-addl-field");
        const t = s.additionalTests.find(x=>x.id===id);
        if(t){
          t[field] = el.value;
          if(field==="name"){
            const cat = TEST_CATALOG.find(c=>c.name.toLowerCase()===el.value.trim().toLowerCase());
            if(cat) t.discipline = cat.discipline;
            const ps = getParamSetForTestName(el.value);
            if(ps && ps.parameters && ps.parameters.length){
              if(!t.paramValues) t.paramValues = {};
              const untouched = Object.keys(t.paramValues).length===0;
              if(untouched){
                ps.parameters.forEach(p=>{
                  if(p.type!=="Calculated" && p.defaultValue) t.paramValues[p.id] = p.defaultValue;
                });
              }
            }
          }
          await saveDB(); render();
        }
      });
    });
    document.querySelectorAll("[data-addlparam-field]").forEach(el=>{
      el.addEventListener("change", async ()=>{
        const id = el.getAttribute("data-addl-id");
        const paramId = el.getAttribute("data-param-id");
        const t = s.additionalTests.find(x=>x.id===id);
        if(t){
          if(!t.paramValues) t.paramValues = {};
          t.paramValues[paramId] = el.value;
          await saveDB();
          render();
        }
      });
    });
  }
}

function attachTeamHandlers(){
  const addBtn = document.getElementById("tm-add");
  if(addBtn) addBtn.onclick = async ()=>{
    const name = document.getElementById("tm-name").value.trim();
    const uname = document.getElementById("tm-user").value.trim().toLowerCase();
    const pass = document.getElementById("tm-pass").value;
    const role = document.getElementById("tm-role").value;
    if(!name||!uname||!pass){ flash={type:"err",msg:"Fill in name, username and password."}; render(); return; }
    if(DB.users[uname]){ flash={type:"err",msg:"That username already exists."}; render(); return; }
    DB.users[uname] = {username:uname,name,passHash:simpleHash(pass),role};
    await saveDB();
    flash={type:"ok",msg:`${name} added.`};
    render();
  };
  document.querySelectorAll("[data-user-del]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const uname = el.getAttribute("data-user-del");
      if(confirm(`Remove user "${uname}"?`)){
        delete DB.users[uname];
        await saveDB();
        render();
      }
    });
  });
}

function attachSettingsHandlers(){
  const save = document.getElementById("st-save");
  if(save) save.onclick = async ()=>{
    DB.meta.labName = document.getElementById("st-lab").value.trim() || DB.meta.labName;
    DB.meta.labAddress = document.getElementById("st-addr").value.trim();
    await saveDB();
    flash={type:"ok",msg:"Settings saved."};
    render();
  };
  const backupBtn = document.getElementById("st-backup-download");
  if(backupBtn) backupBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `mtl-lims-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  const restoreInput = document.getElementById("st-backup-file");
  if(restoreInput) restoreInput.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!confirm("Restoring a backup will replace ALL current data in this browser (samples, specs, settings, everything) with the contents of the backup file. This cannot be undone. Continue?")) {
      restoreInput.value = "";
      return;
    }
    try{
      const text = await file.text();
      const restored = JSON.parse(text);
      if(!restored || typeof restored !== "object" || !restored.samples){
        flash = {type:"err", msg:"That file doesn't look like a valid MTL LIMS backup."};
        render();
        return;
      }
      DB = restored;
      if(!DB.meta) DB.meta = defaultDB().meta;
      if(!DB.specs) DB.specs = {};
      if(!DB.testMethods) DB.testMethods = {};
      if(!DB.equipment) DB.equipment = {};
      if(!DB.testParamSets) DB.testParamSets = {};
      if(!DB.invoices) DB.invoices = {};
      if(!DB.priceList) DB.priceList = {};
      await saveDB();
      applyTheme(DB.meta.theme||"amber-industrial");
      flash = {type:"ok", msg:"Backup restored successfully."};
      render();
    }catch(err){
      flash = {type:"err", msg:"Could not read that backup file — it may be corrupted or not valid JSON."};
      render();
    }
  });
  const fbConnectBtn = document.getElementById("fb-connect");
  if(fbConnectBtn) fbConnectBtn.onclick = async ()=>{
    const raw = document.getElementById("fb-config-input").value.trim();
    if(!raw){ flash={type:"err", msg:"Paste your Firebase config snippet first."}; render(); return; }
    let config;
    try{ config = parseFirebaseConfigSnippet(raw); }
    catch(e){ flash = {type:"err", msg:e.message}; render(); return; }
    const result = await connectFirebase(config, {seedIfEmpty:true});
    if(!result.ok){ flash = {type:"err", msg:"Could not connect: "+result.error}; }
    else { flash = {type:"ok", msg:"Connected to shared team database. Any teammate who pastes this same config will now see the same live data."}; }
    render();
  };
  const fbDisconnectBtn = document.getElementById("fb-disconnect");
  if(fbDisconnectBtn) fbDisconnectBtn.onclick = ()=>{
    if(!confirm("Disconnect from the shared team database? This browser will go back to saving data locally only, and won't see any further changes from teammates.")) return;
    disconnectFirebase();
    flash = {type:"ok", msg:"Disconnected — back to local-only mode."};
    render();
  };
}

function attachSpecLibraryHandlers(){
  const addBtn = document.getElementById("spec-add");
  if(addBtn) addBtn.onclick = async ()=>{
    const sp = blankSpec();
    DB.specs[sp.id] = sp;
    await saveDB(); render();
  };
  document.querySelectorAll("[data-lib-del]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const id = el.getAttribute("data-lib-del");
      if(confirm("Delete this specification from the library? Samples already linked to it will keep their existing requirement values.")){
        delete DB.specs[id];
        await saveDB(); render();
      }
    });
  });
  document.querySelectorAll("[data-lib-field]").forEach(el=>{
    el.addEventListener("change", async ()=>{
      const id = el.getAttribute("data-lib-id");
      const field = el.getAttribute("data-lib-field");
      if(DB.specs[id]){ DB.specs[id][field] = el.value; await saveDB(); }
    });
  });
  document.querySelectorAll("[data-lib-chem-field]").forEach(el=>{
    el.addEventListener("change", async ()=>{
      const id = el.getAttribute("data-lib-id");
      const field = el.getAttribute("data-lib-chem-field");
      if(DB.specs[id]){ if(!DB.specs[id].chem) DB.specs[id].chem = {}; DB.specs[id].chem[field] = el.value; await saveDB(); }
    });
  });
  const parseBtn = document.getElementById("spec-parse");
  if(parseBtn) parseBtn.onclick = ()=>{
    const fileInput = document.getElementById("spec-file");
    const file = fileInput && fileInput.files && fileInput.files[0];
    if(!file){ flash={type:"err",msg:"Choose a file first."}; render(); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const parsed = parseSpecWorkbook(data);
        if(!parsed.length){
          flash={type:"err",msg:"No specification rows recognized in that file — check that it has a Grade/Specification column with values."};
          pendingImportSpecs = null;
          render();
          return;
        }
        pendingImportSpecs = parsed;
        render();
      }catch(err){
        flash={type:"err",msg:"Could not read that file: "+err.message};
        render();
      }
    };
    reader.onerror = ()=>{ flash={type:"err",msg:"Could not read that file."}; render(); };
    reader.readAsArrayBuffer(file);
  };
  const confirmBtn = document.getElementById("spec-import-confirm");
  if(confirmBtn) confirmBtn.onclick = async ()=>{
    if(!pendingImportSpecs) return;
    pendingImportSpecs.forEach(sp=>{
      const existing = Object.values(DB.specs).find(x=>(x.name||"").trim().toLowerCase()===(sp.name||"").trim().toLowerCase());
      if(existing) sp.id = existing.id;
      DB.specs[sp.id] = sp;
    });
    const n = pendingImportSpecs.length;
    pendingImportSpecs = null;
    await saveDB();
    flash={type:"ok",msg:`Imported ${n} specification(s).`};
    render();
  };
  const cancelBtn = document.getElementById("spec-import-cancel");
  if(cancelBtn) cancelBtn.onclick = ()=>{ pendingImportSpecs = null; render(); };
}

/* Lightweight partial refresh for the search box so keystrokes don't lose focus */
function renderInPlaceDashboard(){
  const main = document.querySelector(".main");
  if(!main) return;
  main.innerHTML = renderView();
  attachViewHandlers();
  const search = document.getElementById("dash-search");
  if(search){ search.focus(); const v=search.value; search.value=""; search.value=v; }
}

/* ===================== INIT ===================== */
(async function init(){
  await loadDB();
  applyTheme(DB.meta.theme);
  render();
  const savedFirebaseConfig = getFirebaseConfig();
  if(savedFirebaseConfig){
    connectFirebase(savedFirebaseConfig, {seedIfEmpty:false}).then(()=>render());
  }
})();
</script>
