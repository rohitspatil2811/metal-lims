<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTL / LIMS — Metal Testing Laboratory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --ink:#182228;
    --ink-soft:#4b5a62;
    --paper:#e2e7e1;
    --panel:#ffffff;
    --line:#ccd3cd;
    --line-soft:#e3e7e2;
    --amber:#c98a2b;
    --amber-soft:#f3e2c2;
    --teal:#2f6f63;
    --teal-soft:#dcece7;
    --red:#a8493f;
    --red-soft:#f1dcd8;
    --sans:'IBM Plex Sans', Arial, sans-serif;
    --mono:'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--sans);
    background:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px),
      radial-gradient(circle at 8% 12%, rgba(40,100,200,0.42) 0%, transparent 42%),
      radial-gradient(circle at 92% 8%, rgba(30,140,90,0.40) 0%, transparent 44%),
      radial-gradient(circle at 15% 88%, rgba(225,180,20,0.42) 0%, transparent 44%),
      radial-gradient(circle at 90% 85%, rgba(190,60,130,0.36) 0%, transparent 44%),
      radial-gradient(circle at 50% 50%, rgba(110,70,190,0.22) 0%, transparent 58%),
      var(--paper);
    background-size:28px 28px, 28px 28px, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
    background-attachment:fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed;
    color:var(--ink);
    min-height:100vh;
  }
  #root{min-height:100vh;}
  a{color:inherit;}
  ::selection{background:var(--amber-soft);}

  /* ---- Layout shell ---- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:220px;flex-shrink:0;background:var(--ink);color:#e9ede9;
    display:flex;flex-direction:column;padding:22px 0;
  }
  .brand{
    padding:0 20px 18px 20px;border-bottom:1px solid #2c3a41;margin-bottom:10px;
  }
  .brand-mark{
    font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:1px;
    color:#f4f0e6;text-shadow:0 1px 0 rgba(0,0,0,.4), 0 -1px 0 rgba(255,255,255,.08);
  }
  .brand-sub{font-size:10.5px;letter-spacing:2px;color:#8fa39c;margin-top:4px;text-transform:uppercase;}
  .nav-item{
    padding:11px 20px;font-size:13.5px;color:#c7d1cc;cursor:pointer;border-left:3px solid transparent;
    display:flex;align-items:center;gap:9px;
  }
  .nav-item:hover{background:#212e34;color:#fff;}
  .nav-item.active{background:#212e34;border-left-color:var(--amber);color:#fff;font-weight:600;}
  .nav-tag{font-family:var(--mono);font-size:11px;color:#6c8079;}
  .sidebar-foot{margin-top:auto;padding:14px 20px 0 20px;border-top:1px solid #2c3a41;}
  .who{font-size:12.5px;color:#c7d1cc;}
  .who b{color:#fff;}
  .role-pill{
    display:inline-block;margin-top:4px;font-family:var(--mono);font-size:10px;letter-spacing:1px;
    padding:2px 7px;border-radius:2px;background:#2c3a41;color:#9fb3ab;text-transform:uppercase;
  }
  .logout-btn{
    margin-top:10px;width:100%;background:transparent;border:1px solid #3a4a52;color:#c7d1cc;
    padding:7px 0;font-size:12px;font-family:var(--sans);cursor:pointer;border-radius:2px;
  }
  .logout-btn:hover{background:#2c3a41;color:#fff;}

  .main{flex:1;min-width:0;padding:26px 32px 60px 32px;}
  .topline{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:22px;font-weight:700;margin:0;}
  .page-eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--ink-soft);text-transform:uppercase;margin:0 0 4px 0;
  }

  /* ---- Buttons ---- */
  .btn{
    font-family:var(--sans);font-size:13px;font-weight:600;padding:9px 16px;border-radius:2px;border:1px solid var(--ink);
    background:var(--ink);color:#fff;cursor:pointer;letter-spacing:.2px;
  }
  .btn:hover{background:#2c3a41;}
  .btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.outline:hover{border-color:var(--ink);}
  .btn.danger{background:var(--red);border-color:var(--red);}
  .btn.danger:hover{background:#8f3a31;}
  .btn.amber{background:var(--amber);border-color:var(--amber);color:#241a05;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---- Cards / panels ---- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:20px;margin-bottom:18px;}
  .panel-title{
    font-family:var(--mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid var(--line-soft);padding-bottom:9px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;
  }
  .grid{display:grid;gap:14px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  .grid-4{grid-template-columns:1fr 1fr 1fr 1fr;}
  @media (max-width:840px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
  .chem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:4px;}
  .chem-element-block{border:1px solid var(--line-soft);border-radius:6px;padding:10px;background:var(--panel);}
  .chem-element-block .field{margin-bottom:8px;}
  .chem-element-block .field:last-child{margin-bottom:0;}

  label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;letter-spacing:.2px;}
  input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
    width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:2px;font-family:var(--mono);font-size:13px;
    background:#fdfdfb;color:var(--ink);
  }
  textarea{font-family:var(--sans);min-height:70px;resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal);}
  .field{margin-bottom:12px;}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .checkline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px;}
  .checkline input{width:auto;}

  /* ---- Stat cards ---- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  @media (max-width:840px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:15px 16px;}
  .stat-num{font-family:var(--mono);font-size:26px;font-weight:700;}
  .stat-label{font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}

  /* ---- Table ---- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
    color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px 8px;
  }
  td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tr:hover td{background:#f7f8f6;}
  .lab-badge{
    font-family:var(--mono);font-weight:700;font-size:12.5px;background:var(--ink);color:#f4f0e6;
    padding:3px 7px;border-radius:2px;letter-spacing:.5px;
  }
  .status-pill{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:10px;font-weight:600;
  }
  .status-Received{background:var(--amber-soft);color:#7a5514;}
  .status-InProgress{background:#dde5f0;color:#33517a;}
  .status-Completed{background:var(--teal-soft);color:#215146;}

  /* ---- Tabs ---- */
  .tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
  .tabbtn{
    font-family:var(--mono);font-size:12px;letter-spacing:.5px;padding:9px 14px;cursor:pointer;color:var(--ink-soft);
    border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;
  }
  .tabbtn.active{color:var(--ink);border-bottom-color:var(--amber);font-weight:700;}
  .tabbtn:hover{color:var(--ink);}

  /* ---- Result chips ---- */
  .result-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px;}
  .result-chip{background:#f7f8f6;border:1px solid var(--line-soft);border-left:3px solid var(--teal);padding:8px 10px;border-radius:2px;}
  .result-chip .v{font-family:var(--mono);font-weight:700;font-size:15px;}
  .result-chip .l{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;margin-top:2px;}
  .result-chip .r{font-size:10.5px;color:var(--ink-soft);margin-top:3px;font-family:var(--mono);}
  .result-chip.fail{border-left-color:var(--red);}
  .result-chip.fail .v{color:var(--red);}
  .result-chip.pass .v{color:var(--teal);}
  .req-input{font-family:var(--mono);font-size:12px;}
  .conform-pass{color:var(--teal);font-weight:600;}
  .conform-fail{color:var(--red);font-weight:700;}
  .area-type-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .area-type-tab{font-family:var(--mono);font-size:11.5px;padding:5px 11px;border:1px solid var(--line);border-radius:2px;background:#fff;cursor:pointer;letter-spacing:.4px;}
  .area-type-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .subhead{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px 0;border-top:1px dashed var(--line);padding-top:12px;}

  .specimen-row{border:1px solid var(--line-soft);border-radius:2px;padding:12px;margin-bottom:10px;background:#fbfbf9;}
  .row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .row-head .tag{font-family:var(--mono);font-size:11px;color:var(--ink-soft);}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:380px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:30px 28px;position:relative;}
  .login-card:before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:repeating-linear-gradient(90deg,var(--amber) 0 12px, var(--ink) 12px 24px);
  }
  .login-title{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:1px;margin:6px 0 2px 0;}
  .login-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}
  .err-msg{background:var(--red-soft);color:#7a2e24;font-size:12.5px;padding:8px 10px;border-radius:2px;margin-bottom:12px;}
  .ok-msg{background:var(--teal-soft);color:#215146;font-size:12.5px;padding:8px 10px;border-radius:2px;margin-bottom:12px;}

  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .big{font-family:var(--mono);font-size:14px;margin-bottom:6px;color:var(--ink);}

  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:15px;padding:2px 6px;}
  .icon-btn:hover{color:var(--red);}

  /* ---- Report / print ---- */
  .report-sheet{background:#fff;border:1px solid var(--line);padding:22px 28px;max-width:820px;margin:0 auto;font-size:12px;line-height:1.35;}
  .report-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid var(--ink);padding-bottom:8px;margin-bottom:10px;}
  .report-lab-name{font-size:17px;font-weight:700;}
  .report-lab-addr{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}
  .report-tag{
    font-family:var(--mono);text-align:right;
  }
  .report-tag .num{font-size:16px;font-weight:700;letter-spacing:1px;}
  .report-tag .cap{font-size:9px;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;}
  .barcode{display:flex;gap:2px;height:20px;margin-top:4px;justify-content:flex-end;}
  .barcode span{display:inline-block;width:2px;background:var(--ink);}
  .report-section-title{
    font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);
    margin:12px 0 4px 0;border-bottom:1px solid var(--line-soft);padding-bottom:3px;
  }
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;font-size:11px;margin-bottom:2px;}
  .kv-grid div span.k{color:var(--ink-soft);}
  .report-sheet table{font-size:11px;}
  .report-sheet th{padding:3px 6px;font-size:9.5px;}
  .report-sheet td{padding:3px 6px;line-height:1.3;}
  .report-disclaimer{margin-top:14px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:9px;line-height:1.5;color:var(--ink-soft);}
  .report-disclaimer b{color:var(--ink);}
  .report-endline{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--ink-soft);margin-top:16px;}
  .report-sign{display:flex;justify-content:space-between;margin-top:24px;font-size:10.5px;}
  .sign-line{border-top:1px solid var(--ink);margin-top:20px;padding-top:4px;width:180px;text-align:center;color:var(--ink-soft);}
  @media print{
    body{background:#fff;}
    .sidebar,.no-print{display:none !important;}
    .main{padding:0;}
    .report-sheet{border:none;max-width:100%;padding:0;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ===================== CONSTANTS ===================== */
const STANDARD_GRADES = [
  // Stainless steel — pipe (A312), plate (A240), forging/fitting (A182), bar (A276)
  "ASTM A312 TP304","ASTM A312 TP304L","ASTM A312 TP316","ASTM A312 TP316L","ASTM A312 TP321","ASTM A312 TP347",
  "ASTM A240 TP304","ASTM A240 TP304L","ASTM A240 TP316","ASTM A240 TP316L","ASTM A240 TP321","ASTM A240 TP347",
  "ASTM A182 F304","ASTM A182 F304L","ASTM A182 F316","ASTM A182 F316L","ASTM A182 F321","ASTM A182 F347",
  "ASTM A276 Type 410","ASTM A276 Type 420","ASTM A276 Type 430","ASTM A276 Type 440C",
  "ASTM A479 UNS S17400 (17-4PH)",
  // Duplex / super duplex
  "ASTM A240 S32205 (2205)","ASTM A182 F51 (2205)","ASTM A790 UNS S32750 (2507)","ASTM A240 S32304 (2304)",
  // Carbon / mild steel — pipe, flange/forging, plate, casting, structural
  "ASTM A106 Grade B","ASTM A106 Grade C","ASTM A105","ASTM A105N",
  "ASTM A350 LF2 Class 1","ASTM A333 Grade 6","ASTM A216 WCB","ASTM A234 WPB","ASTM A420 WPL6",
  "ASTM A516 Grade 60","ASTM A516 Grade 70","ASTM A537 Class 1","ASTM A36",
  "ASTM A572 Grade 50","ASTM A588 Grade A","IS 2062 Grade E250 A","IS 2062 Grade E350",
  "IS 1239 Grade YSt210","IS 3589 Grade 410",
  // Alloy steel — pipe/forging (Cr-Mo)
  "ASTM A335 P11","ASTM A335 P22","ASTM A335 P91","ASTM A182 F11","ASTM A182 F22","ASTM A182 F91",
  "AISI/SAE 4130","AISI/SAE 4140","AISI/SAE 4340","AISI/SAE 8620",
  // Tool steel
  "AISI O1","AISI A2","AISI D2","AISI H13","AISI M2",
  // Low temp / cryogenic
  "ASTM A333 Grade 3","ASTM A353 (9% Ni)",
  // HIC / corrosion test standards (kept for the corrosion module's own datalist use)
  "ASTM A262","ASTM G28","ASTM G48","NACE TM0284 (HIC)",
];
const STORE_KEY = "lims-db";

/* ===================== COLOR THEMES ===================== */
const THEMES = {
  "amber-industrial": {
    label: "Industrial Amber",
    vars: { "--ink":"#182228","--ink-soft":"#4b5a62","--paper":"#dde3dc","--panel":"#ffffff",
      "--line":"#b7c1b8","--line-soft":"#d3dad2","--amber":"#c98a2b","--amber-soft":"#f3e2c2",
      "--teal":"#2f6f63","--teal-soft":"#dcece7","--red":"#a8493f","--red-soft":"#f1dcd8" }
  },
  "steel-blue": {
    label: "Steel Blue",
    vars: { "--ink":"#152233","--ink-soft":"#4a5f75","--paper":"#dbe2ea","--panel":"#ffffff",
      "--line":"#adbccb","--line-soft":"#cdd8e2","--amber":"#2f6fa8","--amber-soft":"#cfe0ee",
      "--teal":"#2f6f63","--teal-soft":"#dcece7","--red":"#a8493f","--red-soft":"#f1dcd8" }
  },
  "slate-copper": {
    label: "Slate & Copper",
    vars: { "--ink":"#232323","--ink-soft":"#5c5652","--paper":"#e0dad0","--panel":"#ffffff",
      "--line":"#c2b7a8","--line-soft":"#d9d0c3","--amber":"#b5602f","--amber-soft":"#ecd3bf",
      "--teal":"#3e7a5c","--teal-soft":"#deece2","--red":"#a8493f","--red-soft":"#f1dcd8" }
  },
  "forest-clay": {
    label: "Forest & Clay",
    vars: { "--ink":"#1c2820","--ink-soft":"#4d5c52","--paper":"#dce2d4","--panel":"#ffffff",
      "--line":"#b6c3aa","--line-soft":"#d0d9c5","--amber":"#8a6b2f","--amber-soft":"#e6dab8",
      "--teal":"#2f7a4f","--teal-soft":"#dcecdf","--red":"#a8493f","--red-soft":"#f1dcd8" }
  },
  "graphite-violet": {
    label: "Graphite & Violet",
    vars: { "--ink":"#201f26","--ink-soft":"#585268","--paper":"#dcd8e5","--panel":"#ffffff",
      "--line":"#b4abc9","--line-soft":"#d1cbe0","--amber":"#6c4fa0","--amber-soft":"#dcd0ec",
      "--teal":"#2f7a6a","--teal-soft":"#dcece7","--red":"#a8493f","--red-soft":"#f1dcd8" }
  },
  "midnight-mint": {
    label: "Midnight & Mint",
    vars: { "--ink":"#0f2027","--ink-soft":"#3f5560","--paper":"#d5e5e2","--panel":"#ffffff",
      "--line":"#9fc3bc","--line-soft":"#c7ddd7","--amber":"#0e7c66","--amber-soft":"#c7e9de",
      "--teal":"#2f6f63","--teal-soft":"#dcece7","--red":"#a8493f","--red-soft":"#f1dcd8" }
  },
};
function applyTheme(themeKey){
  const theme = THEMES[themeKey] || THEMES["amber-industrial"];
  const root = document.documentElement;
  Object.entries(theme.vars).forEach(([k,v])=> root.style.setProperty(k, v));
}

/* ===================== STATE ===================== */
let DB = null;
let session = null;
let view = "loading";
let activeLabNumber = null;
let activeInvoiceId = null;
let activeSampleTab = "overview";
let wizardStep = 1;
let wizardData = null;
let dashboardFilter = "";
let flash = null; // {type,msg}
let pendingImportSpecs = null;

/* ===================== UTIL ===================== */
function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function num(v){ const n=parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt(v, d=2){ if(v===null||v===undefined||isNaN(v)) return "—"; return Number(v).toFixed(d); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function simpleHash(s){
  let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i)) >>> 0; }
  return "h"+h.toString(36);
}

/* ===================== STORAGE ===================== */
function defaultDB(){
  return {
    users: {},
    samples: {},
    specs: {},
    testMethods: {},
    equipment: {},
    testParamSets: {},
    invoices: {},
    priceList: {},
    meta: { lastNumber: 0, lastInvoiceNumber: 0, labName: "Metallurgical Testing Laboratory", labAddress: "", setupDone:false, theme:"amber-industrial" }
  };
}
async function loadDB(){
  try{
    const res = await storageGet(STORE_KEY);
    if(res){
      DB = JSON.parse(res);
      if(!DB.meta) DB.meta = defaultDB().meta;
      if(!DB.specs) DB.specs = {};
      if(!DB.testMethods) DB.testMethods = {};
      if(!DB.equipment) DB.equipment = {};
      if(!DB.testParamSets) DB.testParamSets = {};
      if(!DB.invoices) DB.invoices = {};
      if(!DB.priceList) DB.priceList = {};
      if(!DB.meta.theme) DB.meta.theme = "amber-industrial";
      if(DB.meta.lastInvoiceNumber===undefined) DB.meta.lastInvoiceNumber = 0;
    } else {
      DB = defaultDB();
    }
  }catch(e){
    DB = defaultDB();
  }
}
async function saveDB(){
  try{
    await storageSet(STORE_KEY, JSON.stringify(DB));
    await pushToFirebaseIfConnected();
  }catch(e){
    flash = {type:"err", msg:"Could not save your data — please use 'Download backup' in Lab Settings right away so nothing is lost."};
  }
}
/* Storage abstraction: uses Claude.ai's artifact storage (window.storage) when this
   file is viewed inside Claude's artifact pane, and falls back to the browser's own
   localStorage when the file is opened directly (double-clicked, or served locally) —
   which is how this tool is designed to be used day-to-day. Without this fallback,
   window.storage simply doesn't exist outside Claude's artifact viewer and every save
   would silently fail, resetting all data on every reload. */
const LOCAL_KEY = "mtl-lims-local-db";
async function storageGet(key){
  if(typeof window.storage!=="undefined" && window.storage && window.storage.get){
    try{
      const res = await window.storage.get(key, true);
      if(res && res.value) return res.value;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{ return window.localStorage.getItem(LOCAL_KEY); }catch(e){ return null; }
}
async function storageSet(key, value){
  let usedRemote = false;
  if(typeof window.storage!=="undefined" && window.storage && window.storage.set){
    try{ await window.storage.set(key, value, true); usedRemote = true; }catch(e){ /* fall through */ }
  }
  try{ window.localStorage.setItem(LOCAL_KEY, value); }catch(e){
    if(!usedRemote) throw e;
  }
}

/* ===================== TEAM SYNC (Firebase Realtime Database) =====================
   Optional upgrade for multi-person teams. Everything above still works fully offline,
   single-browser, with no setup. If a team wants everyone's changes to appear on
   everyone else's screen automatically, one person creates a free Firebase project
   and pastes its config here (Lab Settings). Every teammate then pastes that SAME
   config into their own copy once, and from then on all of them read/write the same
   shared database instead of their own separate local copy. */
const FIREBASE_CONFIG_KEY = "mtl-lims-firebase-config";
let firebaseApp = null;
let firebaseRef = null;
let firebaseStatus = "none"; // none | connecting | connected | error
let firebaseLastError = "";
let firebaseSuppressNextSave = false; // avoids re-pushing data we just received from Firebase itself
function getFirebaseConfig(){
  try{
    const raw = window.localStorage.getItem(FIREBASE_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function parseFirebaseConfigSnippet(text){
  // Accepts the raw snippet Firebase's console gives you, e.g.
  // const firebaseConfig = { apiKey: "...", authDomain: "...", ... };
  // Extracts just the {...} object literal and evaluates it — this is the user's
  // own config pasted from their own Firebase console, not third-party input.
  const match = text.match(/\{[\s\S]*\}/);
  if(!match) throw new Error("Could not find a { ... } config object in what you pasted.");
  const obj = new Function("return (" + match[0] + ");")();
  if(!obj || !obj.databaseURL) throw new Error("That config is missing a databaseURL — make sure you enabled Realtime Database (not just Firestore) in your Firebase project.");
  return obj;
}
async function connectFirebase(config, {seedIfEmpty}={seedIfEmpty:true}){
  if(typeof firebase === "undefined"){
    firebaseStatus = "error";
    firebaseLastError = "The Firebase library hasn't finished loading yet — please wait a moment and try again.";
    return {ok:false, error:firebaseLastError};
  }
  try{
    firebaseStatus = "connecting";
    if(firebaseApp){ try{ await firebaseApp.delete(); }catch(e){} }
    firebaseApp = firebase.initializeApp(config, "mtlLims-"+Date.now());
    firebaseRef = firebaseApp.database().ref("lims-db");
    window.localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(config));
    firebaseRef.on("value", (snapshot)=>{
      const remote = snapshot.val();
      firebaseStatus = "connected";
      firebaseLastError = "";
      if(remote){
        firebaseSuppressNextSave = true;
        DB = remote;
        if(!DB.meta) DB.meta = defaultDB().meta;
        if(!DB.specs) DB.specs = {};
        if(!DB.testMethods) DB.testMethods = {};
        if(!DB.equipment) DB.equipment = {};
        if(!DB.testParamSets) DB.testParamSets = {};
        if(!DB.invoices) DB.invoices = {};
        if(!DB.priceList) DB.priceList = {};
        if(!DB.meta.theme) DB.meta.theme = "amber-industrial";
        applyTheme(DB.meta.theme);
        render();
      } else if(seedIfEmpty && DB){
        firebaseRef.set(DB);
      }
    }, (err)=>{
      firebaseStatus = "error";
      firebaseLastError = (err && err.message) ? err.message : String(err);
      flash = {type:"err", msg:"Lost connection to the shared team database: "+firebaseLastError+". Your changes are still being saved locally."};
      render();
    });
    return {ok:true};
  }catch(e){
    firebaseStatus = "error";
    firebaseLastError = e.message;
    return {ok:false, error:e.message};
  }
}
function disconnectFirebase(){
  if(firebaseRef){ try{ firebaseRef.off(); }catch(e){} }
  if(firebaseApp){ try{ firebaseApp.delete(); }catch(e){} }
  firebaseApp = null; firebaseRef = null; firebaseStatus = "none";
  try{ window.localStorage.removeItem(FIREBASE_CONFIG_KEY); }catch(e){}
}
async function pushToFirebaseIfConnected(){
  if(firebaseSuppressNextSave){ firebaseSuppressNextSave = false; return; }
  if(firebaseRef && firebaseStatus==="connected"){
    try{ await firebaseRef.set(DB); }catch(e){
      flash = {type:"err", msg:"Could not sync to the shared team database — your change is saved locally and will sync once the connection is back."};
    }
  }
}

/* ===================== CALCULATIONS ===================== */
const ELEMENTS = ["C","Mn","Si","S","P","Cr","Mo","Ni","Cu","V","Nb","Ti","Al"];
const AREA_TYPES = [
  {id:"round", label:"Round"},
  {id:"hollow", label:"Hollow / tube section"},
  {id:"flat", label:"Flat (width × thickness)"},
  {id:"manual", label:"Manual area entry"},
];
function areaFor(type, sp, stage){
  // stage: "" for original, "final" for at-fracture
  const p = (f)=> stage==="final" ? "final"+f.charAt(0).toUpperCase()+f.slice(1) : f;
  if(type==="round"){
    const d = num(sp[p("diameter")]);
    return d>0 ? (Math.PI/4)*d*d : null;
  }
  if(type==="hollow"){
    const od = num(sp[stage==="final" ? "finalOuterDia" : "outerDia"]);
    const id = num(sp[stage==="final" ? "finalInnerDia" : "innerDia"]);
    return od>0 ? (Math.PI/4)*(od*od - id*id) : null;
  }
  if(type==="flat"){
    const w = num(sp[stage==="final" ? "finalWidth" : "width"]);
    const t = num(sp[stage==="final" ? "finalThickness" : "thickness"]);
    return (w>0 && t>0) ? w*t : null;
  }
  // manual
  const m = num(sp[stage==="final" ? "areaFManual" : "area0Manual"]);
  return m>0 ? m : null;
}
function calcSpecimen(sp){
  const areaType = sp.areaType || "round";
  const area0 = areaFor(areaType, sp, "");
  const areaF = areaFor(areaType, sp, "final");
  const hasYieldLoad = sp.yieldLoad!==undefined && sp.yieldLoad!=="";
  const hasUltLoad = sp.ultimateLoad!==undefined && sp.ultimateLoad!=="";
  const YS = (hasYieldLoad && area0!==null && area0>0) ? num(sp.yieldLoad)/area0 : null;
  const UTS = (hasUltLoad && area0!==null && area0>0) ? num(sp.ultimateLoad)/area0 : null;
  const hasL0 = sp.gaugeLength!==undefined && sp.gaugeLength!=="";
  const hasLf = sp.finalGaugeLength!==undefined && sp.finalGaugeLength!=="";
  const L0 = num(sp.gaugeLength);
  const Lf = num(sp.finalGaugeLength);
  const elong = (hasL0 && hasLf && L0>0) ? ((Lf-L0)/L0)*100 : null;
  const RA = (area0!==null && area0>0 && areaF!==null) ? ((area0-areaF)/area0)*100 : null;
  const hardVals = (sp.hardness||"").split(/[,\s]+/).map(s=>parseFloat(s)).filter(n=>!isNaN(n));
  const avgHardness = hardVals.length ? hardVals.reduce((a,b)=>a+b,0)/hardVals.length : null;
  return {area0, areaF, YS, UTS, elong, RA, avgHardness, hardVals, areaType};
}
/* Requirement text parsing, e.g. "250 min.", "0.35 max.", "0.60-1.05" */
function parseReq(text){
  if(!text) return null;
  const t = String(text).trim();
  let m = t.match(/^(-?[\d.]+)\s*-\s*(-?[\d.]+)$/);
  if(m) return {min:parseFloat(m[1]), max:parseFloat(m[2])};
  m = t.match(/^(-?[\d.]+)\s*max\.?$/i);
  if(m) return {max:parseFloat(m[1])};
  m = t.match(/^(-?[\d.]+)\s*min\.?$/i);
  if(m) return {min:parseFloat(m[1])};
  m = t.match(/^min\.?\s*(-?[\d.]+)$/i);
  if(m) return {min:parseFloat(m[1])};
  m = t.match(/^max\.?\s*(-?[\d.]+)$/i);
  if(m) return {max:parseFloat(m[1])};
  return null;
}
function checkConform(value, reqText){
  if(value===null || value===undefined || isNaN(value)) return null;
  const r = parseReq(reqText);
  if(!r) return null;
  let pass = true;
  if(r.min!==undefined && value < r.min) pass = false;
  if(r.max!==undefined && value > r.max) pass = false;
  return pass;
}
function testTypeConformance(s, key){
  if(key==="mechanical"){
    if(!s.testsRequested.mechanical) return null;
    let any=false, fail=false;
    (s.mechanical.specimens||[]).forEach(sp=>{
      const c = calcSpecimen(sp);
      const checks = [[c.YS,sp.yieldReq],[c.UTS,sp.utsReq],[c.elong,sp.elongReq],[c.RA,sp.raReq],[c.avgHardness,sp.hardnessReq]];
      checks.forEach(([v,r])=>{ const p=checkConform(v,r); if(p!==null){any=true; if(p===false) fail=true;} });
    });
    if(!any) return null;
    return fail ? false : true;
  }
  if(key==="chemical"){
    if(!s.testsRequested.chemical) return null;
    const c = s.chemical, req = c.req||{}; const CE = calcCE(c);
    let any=false, fail=false;
    ELEMENTS.forEach(el=>{
      if(c[el]!==undefined && c[el]!==""){
        const p = checkConform(num(c[el]), req[el]);
        if(p!==null){ any=true; if(p===false) fail=true; }
      }
    });
    const p2 = checkConform(CE, req.CE);
    if(p2!==null){ any=true; if(p2===false) fail=true; }
    if(!any) return null;
    return fail ? false : true;
  }
  if(key==="flattening"){
    if(!s.testsRequested.flattening) return null;
    const pieces = (s.flattening && s.flattening.pieces) || [];
    let any=false, fail=false;
    pieces.forEach(p=>{
      if(p.result==="Pass"){ any=true; }
      else if(p.result==="Fail"){ any=true; fail=true; }
    });
    if(!any) return null;
    return fail ? false : true;
  }
  if(key==="hardnessTest"){
    if(!s.testsRequested.hardnessTest) return null;
    const specimens = (s.hardnessTest && s.hardnessTest.specimens) || [];
    let any=false, fail=false;
    specimens.forEach(sp=>{
      const c = calcHardnessSpecimen(sp);
      const p = checkConform(c.avg, sp.requirement);
      if(p!==null){ any=true; if(p===false) fail=true; }
    });
    if(!any) return null;
    return fail ? false : true;
  }
  if(key==="bendTest"){
    if(!s.testsRequested.bendTest) return null;
    const specimens = (s.bendTest && s.bendTest.specimens) || [];
    let any=false, fail=false;
    specimens.forEach(sp=>{
      if(sp.result==="Satisfactory"){ any=true; }
      else if(sp.result==="Unsatisfactory"){ any=true; fail=true; }
    });
    if(!any) return null;
    return fail ? false : true;
  }
  const CORR_KEY_TO_TEMPLATE = {corrG28:"G28", corrG48:"G48A", corrA262B:"A262B", corrA262E:"A262E"};
  if(CORR_KEY_TO_TEMPLATE[key]){
    if(!s.testsRequested[key]) return null;
    const templateKey = CORR_KEY_TO_TEMPLATE[key];
    const tests = (s.corrosionTests||[]).filter(t=>t.template===templateKey);
    let any=false, fail=false;
    tests.forEach(t=>{
      const r = corrosionTestOverallResult(t);
      if(r!==null){ any=true; if(r===false) fail=true; }
    });
    if(!any) return null;
    return fail ? false : true;
  }
  if(key==="additionalTests"){
    if(!s.testsRequested.additionalTests) return null;
    const tests = s.additionalTests||[];
    let any=false, fail=false;
    tests.forEach(t=>{
      const r = additionalTestConformance(t);
      if(r!==null){ any=true; if(r===false) fail=true; }
    });
    if(!any) return null;
    return fail ? false : true;
  }
  return null;
}
function sampleOverallConformance(s){
  const keys = ["mechanical","hardnessTest","bendTest","chemical","flattening","corrG28","corrG48","corrA262B","corrA262E","additionalTests"];
  let any=false, fail=false;
  keys.forEach(k=>{
    const r = testTypeConformance(s,k);
    if(r!==null){ any=true; if(r===false) fail=true; }
  });
  if(!any) return null;
  return fail ? false : true;
}
function conformBadge(val){
  if(val===null || val===undefined) return "";
  return val
    ? '<span class="conform-pass" style="margin-left:4px;">✓ Pass</span>'

function blankSpec(){
  return {id:uid(), name:"New specification", yieldReq:"", utsReq:"", elongReq:"", raReq:"", hardnessReq:"", CE:"", chem:{}};
}
function applySpecToSample(s, spec){
  if(!spec) return;
  (s.mechanical.specimens||[]).forEach(sp=>{
    if(spec.yieldReq) sp.yieldReq = spec.yieldReq;
    if(spec.utsReq) sp.utsReq = spec.utsReq;

    if(spec.raReq) sp.raReq = spec.raReq;
    if(spec.hardnessReq) sp.hardnessReq = spec.hardnessReq;
  });
  if(!s.chemical.req) s.chemical.req = {};
  ELEMENTS.forEach(el=>{
    const v = (spec.chem||{})[el];
    if(v) s.chemical.req[el] = v;
  });
  if(spec.CE) s.chemical.req.CE = spec.CE;
}
function normalizeHeader(h){ return String(h||"").trim().toLowerCase().replace(/[^a-z0-9]/g,""); }
const SPEC_DIRECT_HEADER_MAP = {
  spec:"name", specification:"name", grade:"name", materialgrade:"name", specgrade:"name", name:"name", steelgrade:"name",
  yield:"yieldReq", ys:"yieldReq", yieldstrength:"yieldReq", yieldstrengthmpa:"yieldReq", yieldrequirement:"yieldReq", yieldstrengthreq:"yieldReq",
  tensile:"utsReq", uts:"utsReq", tensilestrength:"utsReq", ultimatetensilestrength:"utsReq", tensilestrengthmpa:"utsReq", tensilerequirement:"utsReq",
  elongation:"elongReq", elong:"elongReq", elongationpercent:"elongReq", elongationrequirement:"elongReq",
  reductionofarea:"raReq", ra:"raReq", reduction:"raReq", rarequirement:"raReq",
  hardness:"hardnessReq", bhn:"hardnessReq", hb:"hardnessReq", hardnessrequirement:"hardnessReq",
  ce:"CE", carbonequivalent:"CE", ceiiw:"CE", ceiiwreq:"CE",
};
function classifySpecHeader(h){
  const n = normalizeHeader(h);
  if(!n) return null;
  if(SPEC_DIRECT_HEADER_MAP[n]) return {field:SPEC_DIRECT_HEADER_MAP[n], part:null};
  const mm = n.match(/^(.*?)(min|max)$/);
  if(mm){
    const base = mm[1], part = mm[2];
    if(SPEC_DIRECT_HEADER_MAP[base] && SPEC_DIRECT_HEADER_MAP[base]!=="name") return {field:SPEC_DIRECT_HEADER_MAP[base], part};
    const el = ELEMENTS.find(e=>e.toLowerCase()===base);
    if(el) return {field:"chem."+el, part};
  }
  const elExact = ELEMENTS.find(e=>e.toLowerCase()===n);
  if(elExact) return {field:"chem."+elExact, part:null};
  return null;
}
function parseSpecWorkbook(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:"array"});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
  if(!rows.length) return [];
  const headers = rows[0].map(h=>String(h||"").trim());
  const classified = headers.map(h=>classifySpecHeader(h));
  const specs = [];
  for(let r=1; r<rows.length; r++){
    const row = rows[r];
    if(!row || row.every(c=>c===""||c===undefined||c===null)) continue;
    const acc = {};
    let nameVal = "";
    classified.forEach((cl,ci)=>{
      if(!cl) return;
      const val = row[ci];
      if(val===""||val===undefined||val===null) return;
      if(cl.field==="name"){ nameVal = String(val).trim(); return; }
      if(!acc[cl.field]) acc[cl.field] = {direct:null, min:null, max:null};
      if(cl.part==="min") acc[cl.field].min = val;
      else if(cl.part==="max") acc[cl.field].max = val;
      else acc[cl.field].direct = String(val).trim();
    });
    if(!nameVal) continue;
    const finalize = (f)=>{
      const a = acc[f];
      if(!a) return "";
      if(a.direct) return a.direct;
      if(a.min!==null && a.max!==null) return `${a.min}-${a.max}`;
      if(a.min!==null) return `${a.min} min.`;
      if(a.max!==null) return `${a.max} max.`;
      return "";
    };
    const spec = {
      id: uid(), name: nameVal,
      yieldReq: finalize("yieldReq"), utsReq: finalize("utsReq"),
      elongReq: finalize("elongReq"), raReq: finalize("raReq"),
      hardnessReq: finalize("hardnessReq"), CE: finalize("CE"),
      chem: {},
    };
    ELEMENTS.forEach(el=>{ spec.chem[el] = finalize("chem."+el); });
    specs.push(spec);
  }
  return specs;
}
const CHEM_ELEMENTS = ["C","Mn","Si","S","P","Cr","Mo","Ni","Cu","V","Nb","Ti","Al"];
function blankChemTest(){
  const t = {id:uid(), testDate:"", equipmentId:""};
  CHEM_ELEMENTS.forEach(el=>{ t[el] = ""; });
  return t;
}
/* Migrates old single-result chemical data (one flat s.chemical object) into the
   multi-sample format (s.chemical.tests[]) without losing anything already entered. */
function ensureChemicalTests(s, minCount){
  let created = false;
  if(!s.chemical.tests){
    const first = blankChemTest();
    first.testDate = s.chemical.testDate || "";
    first.equipmentId = s.chemical.equipmentId || "";
    CHEM_ELEMENTS.forEach(el=>{ first[el] = s.chemical[el] || ""; });
    s.chemical.tests = [first];
    created = true;
  }
  if(minCount){
    while(s.chemical.tests.length < minCount){
      s.chemical.tests.push(blankChemTest());
      created = true;
    }
  }
  if(!s.chemical.req) s.chemical.req = {};
  if(!s.chemical.method) s.chemical.method = {};
  if(created) saveDB();
  return s.chemical.tests;
}
function calcCE(c){
  const C=num(c.C),Mn=num(c.Mn),Cr=num(c.Cr),Mo=num(c.Mo),V=num(c.V),Ni=num(c.Ni),Cu=num(c.Cu);
  return C + Mn/6 + (Cr+Mo+V)/5 + (Ni+Cu)/15;
}
function calcHICPlate(p){
  const a=num(p.a), b=num(p.b), W=num(p.W), T=num(p.T);
  const CLR = W>0 ? (a/W)*100 : 0;
  const CTR = T>0 ? (b/T)*100 : 0;
  const CSR = (W>0 && T>0) ? ((a*b)/(W*T))*100 : 0;
  return {CLR,CTR,CSR};
}
function calcHICAvg(plates){
  if(!plates || !plates.length) return {results:[], avgCLR:null, avgCTR:null, avgCSR:null};
  const results = plates.map(calcHICPlate);
  const n = results.length;
  const avgCLR = results.reduce((s,r)=>s+r.CLR,0)/n;
  const avgCTR = results.reduce((s,r)=>s+r.CTR,0)/n;
  const avgCSR = results.reduce((s,r)=>s+r.CSR,0)/n;
  return {results, avgCLR, avgCTR, avgCSR};
}
function calcMassLossCorrosion(v){
  const W = num(v.initialWeight)-num(v.finalWeight);
  const D = num(v.density);
  const A = num(v.area);
  const T = num(v.duration);
  const K = 87600;
  const rate_mmpy = (A>0 && D>0 && T>0) ? (K*W)/(A*T*D) : null;
  const rate_mpy = rate_mmpy!==null ? rate_mmpy*39.37 : null;
  return {massLoss:W, rate_mmpy, rate_mpy};
}

/* ===================== STANDALONE HARDNESS TEST ===================== */
function newHardnessSpecimen(){
  return {id:uid(), label:"", scale:"HB", readings:"", requirement:""};
}
function calcHardnessSpecimen(sp){
  const vals = (sp.readings||"").split(/[,\s]+/).map(s=>parseFloat(s)).filter(n=>!isNaN(n));
  const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  return {vals, avg};
}
/* ===================== STANDALONE BEND TEST ===================== */
function newBendSpecimen(){
  return {id:uid(), label:"", bendType:"Face", formerDiameter:"", bendAngle:"180\u00b0", requirement:"No cracks or open defects on the outer bend radius", observation:"", result:""};
}
function newCorrosionTest(templateKey){
  const tpl = CORROSION_TEMPLATES[templateKey];
  const values = {equipmentId:"", testDate:""};
  tpl.fields.forEach(f=>{ values[f.key] = (f.default!==undefined) ? f.default : ""; });
  return {id:uid(), template:templateKey, values};
}
function corrosionTestOverallResult(test){
  const tpl = CORROSION_TEMPLATES[test.template];
  if(!tpl) return null;
  if(tpl.pitting){
    if(test.values.result==="Satisfactory") return true;
    if(test.values.result==="Unsatisfactory") return false;
    return null;
  }
  if(tpl.bendTest){
    const rb = test.values.resultBend, rm = test.values.resultMicro;
    if(!rb && !rm) return null;
    if(rb==="Unsatisfactory" || rm==="Unsatisfactory") return false;
    if(rb==="Satisfactory" || rm==="Satisfactory") return true;
    return null;
  }
  if(tpl.massLoss){
    const c = calcMassLossCorrosion(test.values);
    const p = checkConform(c.rate_mmpy, test.values.requirement);
    return p;
  }
  return null;
}

function anyCorrosionRequested(s){
  const t = s.testsRequested||{};
  return !!(t.corrG28 || t.corrG48 || t.corrA262B || t.corrA262E);
}
function testsSummary(s){
  const map = {mechanical:"Tensile", hardnessTest:"Hard", bendTest:"Bend", chemical:"Chem", flattening:"Flat", hic:"HIC", metallography:"Metallo", additionalTests:"Other"};
  const on = Object.keys(map).filter(k=>s.testsRequested && s.testsRequested[k]);
  const labels = on.map(k=>map[k]);
  if(s.testsRequested){
    if(s.testsRequested.corrG28) labels.push("G28");
    if(s.testsRequested.corrG48) labels.push("G48");
    if(s.testsRequested.corrA262B) labels.push("A262B");
    if(s.testsRequested.corrA262E) labels.push("A262E");
  }
  return labels.length ? labels.join(" · ") : "—";
}

    const customer = document.getElementById("ns-customer").value.trim();
    if(!customer){ flash={type:"err",msg:"Customer name is required."}; render(); return; }
    const s = blankSample();
    s.labNumber = nextLabNumber();
    s.customerName = customer;
    s.clientName = document.getElementById("ns-client").value.trim();
    s.customerAddress = document.getElementById("ns-caddr").value.trim();
    s.customerRef = document.getElementById("ns-ref").value.trim();
    s.customerRefDate = document.getElementById("ns-refdt").value;
    s.materialGrade = document.getElementById("ns-grade").value.trim();
    const gradeMatch = Object.values(DB.specs||{}).find(sp=>(sp.name||"").trim().toLowerCase()===s.materialGrade.toLowerCase());
    if(gradeMatch) s.specId = gradeMatch.id;
    s.size = document.getElementById("ns-size").value.trim();
    s.heatNo = document.getElementById("ns-heat").value.trim();
    s.quantity = document.getElementById("ns-qty").value.trim();
    s.dateReceived = document.getElementById("ns-date").value || todayISO();
    s.sampleDescription = document.getElementById("ns-desc").value.trim();
    s.workOrderNo = document.getElementById("ns-won").value.trim();
    s.workOrderDate = document.getElementById("ns-wod").value;
    s.referenceNo = document.getElementById("ns-refno").value.trim();
    s.referenceDate = document.getElementById("ns-refdate").value;
    s.ulrNo = document.getElementById("ns-ulr").value.trim();
    s.testsRequested = {
      mechanical: document.getElementById("ns-t-mechanical").checked,
      hardnessTest: document.getElementById("ns-t-hardnessTest").checked,
      bendTest: document.getElementById("ns-t-bendTest").checked,
      chemical: document.getElementById("ns-t-chemical").checked,
      flattening: document.getElementById("ns-t-flattening").checked,
      hic: document.getElementById("ns-t-hic").checked,
      corrG28: document.getElementById("ns-t-corrG28").checked,
      corrG48: document.getElementById("ns-t-corrG48").checked,
      corrA262B: document.getElementById("ns-t-corrA262B").checked,
      corrA262E: document.getElementById("ns-t-corrA262E").checked,
      metallography: document.getElementById("ns-t-metallography").checked,
      additionalTests: document.getElementById("ns-t-additionalTests").checked,
    };
    DB.samples[s.labNumber] = s;
    await saveDB();
    flash = {type:"ok", msg:`Sample logged as ${s.labNumber}.`};
    activeLabNumber = s.labNumber;
    activeSampleTab = "overview";
    view = "sampleDetail";
    render();
  };
}

/* ===================== SAMPLE DETAIL ===================== */
function renderSampleDetail(){
  const s = DB.samples[activeLabNumber];
  if(!s){ view="dashboard"; return renderDashboard(); }
  if(!s.flattening) s.flattening = {testMethod:"ASTM A530 / ASTM A999", pieces:[]};
  if(!s.corrosionTests) s.corrosionTests = [];
  if(!s.hardnessTest) s.hardnessTest = {testMethod:"ASTM E10 / E92 / E18", specimens:[]};
  if(!s.bendTest) s.bendTest = {testMethod:"ASTM E190 / AWS D1.1 (Guided Bend Test)", specimens:[]};
  if(!s.testsRequested.hasOwnProperty("flattening")) s.testsRequested.flattening = false;
  const tabs = [["overview","Overview"]];
  if(s.testsRequested.mechanical) tabs.push(["mechanical","Tensile Test"]);
  if(s.testsRequested.hardnessTest) tabs.push(["hardnessTest","Hardness Test"]);
  if(s.testsRequested.bendTest) tabs.push(["bendTest","Bend Test"]);

  if(s.testsRequested.chemical) tabs.push(["chemical","Chemical"]);
  if(s.testsRequested.corrG28) tabs.push(["corrG28","G28"]);

      <button class="btn outline" data-testrecord="${esc(s.labNumber)}">Test Record</button>
      <button class="btn" data-report="${esc(s.labNumber)}">View report</button>
    </div>
  </div>

  <div class="tabbar">
    ${tabs.map(([id,label])=>`<button class="tabbtn ${activeSampleTab===id?'active':''}" data-tab="${id}">${esc(label)}</button>`).join("")}
  </div>

  ${activeSampleTab==="overview" ? renderOverviewTab(s) : ""}
  ${activeSampleTab==="mechanical" ? renderMechanicalTab(s) : ""}
  ${activeSampleTab==="chemical" ? renderChemicalTab(s) : ""}

  ${activeSampleTab==="corrA262B" ? renderCorrosionTemplateTab(s,"A262B") : ""}
  ${activeSampleTab==="corrA262E" ? renderCorrosionTemplateTab(s,"A262E") : ""}
  ${activeSampleTab==="metallography" ? renderMetallographyTab(s) : ""}

function blankTensileSpecimen(areaType){
  return {id:uid(),areaType:areaType||"round",
    diameter:"",finalDiameter:"",
    outerDia:"",innerDia:"",finalOuterDia:"",finalInnerDia:"",
    width:"",thickness:"",finalWidth:"",finalThickness:"",
    area0Manual:"",areaFManual:"",
    gaugeLength:"",finalGaugeLength:"",yieldLoad:"",ultimateLoad:"",hardness:"",hardnessScale:"HB",
    yieldReq:"",utsReq:"",elongReq:"",raReq:"",hardnessReq:""};
}
function ensureMinSpecimens(s, min){
  const sharedType = s.mechanical.sharedAreaType || (s.mechanical.specimens[0] && s.mechanical.specimens[0].areaType) || "round";
  let added = false;
  while(s.mechanical.specimens.length < min){
    s.mechanical.specimens.push(blankTensileSpecimen(sharedType));
    added = true;
  }
  if(added) saveDB();
  return s.mechanical.specimens;
}
function renderMechanicalTab(s){
  if(s.testsRequested.mechanical) ensureMinSpecimens(s, 4);
  const specs = s.mechanical.specimens;
  return `
  <div class="panel">
    <div class="panel-title"><span>Test methods</span></div>
    <div class="grid grid-2">
      <div class="field"><label>Tensile test method</label><input type="text" list="method-list-mech" data-mech-field="tensileMethod" value="${esc(s.mechanical.tensileMethod)}" placeholder="e.g. ASTM A370:2024A"></div>
      <div class="field"><label>Tensile test date</label><input type="date" data-mech-field="testDate" value="${esc(s.mechanical.testDate)}"></div>
      <div class="field"><label>Tensile equipment</label>${equipmentSelectHTML(s.mechanical.tensileEquipmentId, 'data-mech-field="tensileEquipmentId"')}</div>
      ${renderMethodExtraRows(s,"mech-tensile","method-list-mech")}
      <div class="field"><label>Hardness test method</label><input type="text" list="method-list-mech" data-mech-field="hardnessMethod" value="${esc(s.mechanical.hardnessMethod)}" placeholder="e.g. ASTM E10:2023"></div>
      <div class="field"><label>Hardness equipment</label>${equipmentSelectHTML(s.mechanical.hardnessEquipmentId, 'data-mech-field="hardnessEquipmentId"')}</div>

      ${methodDatalist("Mechanical","method-list-mech")}
    </div>
  </div>
  <div class="panel">
    <div class="panel-title"><span>Tensile / yield / hardness — all specimens</span>
      <button class="btn small amber" id="mech-add">+ Add specimen</button>
    </div>
    ${renderTensileEntryTable(s)}
  </div>
  `;
}
function renderTensileEntryTable(s){
  const specs = s.mechanical.specimens;
  if(specs.length===0) return `<div class="empty-state"><div class="big">No specimens added</div><div>Add a specimen to start entering dimensions and loads.</div></div>`;
  const sharedType = s.mechanical.sharedAreaType || specs[0].areaType || "round";
  const rawFields = tensileRawFieldsForType(sharedType);
  const resultLabel = (i)=> i===0 ? "Result" : "Result "+i;
  const inputCell = (sp, field, type)=> `<td><input type="${type||"number"}" ${type!=="text"?'step="any"':""} data-spec-field="${field}" data-spec-id="${sp.id}" value="${esc(sp[field])}" style="width:100%;min-width:90px;"></td>`;
  const inputRow = (field, label, type)=> `<tr><td>${label}</td>${specs.map(sp=>inputCell(sp,field,type)).join("")}<td></td></tr>`;
  const calcs = specs.map(calcSpecimen);
  const calcRow = (label, calcFn, reqField, decimals)=>{
    const cells = calcs.map(c=>{
      const v = calcFn(c);
      const pass = reqField ? checkConform(v, specs[0][reqField]) : null;
      return `<td style="background:var(--result-bg,#f3f7f5);">${v!==null?fmt(v,decimals):"—"}${pass===true?' <span style="color:var(--teal);font-weight:600;">✓</span>':pass===false?' <span style="color:var(--red);font-weight:700;">✕</span>':''}</td>`;
    });
    const reqCell = reqField
      ? `<td><input class="req-input" type="text" data-spec-req-all="${reqField}" value="${esc(specs[0][reqField])}" placeholder="e.g. 250 min." style="width:100%;min-width:100px;"></td>`
      : `<td></td>`;
    return `<tr><td style="font-weight:600;">${label} <span style="color:var(--ink-soft);font-size:10px;font-weight:400;">(calculated)</span></td>${cells.join("")}${reqCell}</tr>`;
  };
  return `
    <div class="field" style="max-width:260px;margin-bottom:12px;"><label>Cross-section type (shared by all specimens)</label>
      <select id="mech-shared-areatype">
        ${AREA_TYPES.map(a=>`<option value="${a.id}" ${a.id===sharedType?"selected":""}>${esc(a.label)}</option>`).join("")}
      </select>
    </div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th>Test Parameter</th>
        ${specs.map((sp,i)=>`<th>${resultLabel(i)} <button class="icon-btn" data-spec-del="${sp.id}" title="Remove">✕</button></th>`).join("")}
        <th>Requirement</th>
      </tr></thead>
      <tbody>
        ${rawFields.map(([f,l])=>inputRow(f,l)).join("")}
        ${calcRow("Cross-sectional area, orig. (mm²)", c=>c.area0, null, 2)}
        ${inputRow("gaugeLength","Original gauge length (mm)")}
        ${inputRow("finalGaugeLength","Final gauge length (mm)")}
        ${inputRow("yieldLoad","Yield load (N)")}
        ${inputRow("ultimateLoad","Ultimate load (N)")}
        ${inputRow("hardness","Hardness readings (comma sep.)","text")}
        ${calcRow("Yield strength (MPa)", c=>c.YS, "yieldReq", 2)}
        ${calcRow("Tensile strength (MPa)", c=>c.UTS, "utsReq", 2)}
        ${calcRow("Elongation (%)", c=>c.elong, "elongReq", 1)}
        <tr><td>Fracture location</td>${specs.map(sp=>`<td><select data-spec-field="fractureLocation" data-spec-id="${sp.id}" style="width:100%;"><option value="" ${!sp.fractureLocation?"selected":""}>—</option><option value="W.G.L." ${sp.fractureLocation==="W.G.L."?"selected":""}>W.G.L. (within gauge length)</option><option value="Outside G.L." ${sp.fractureLocation==="Outside G.L."?"selected":""}>Outside gauge length</option></select></td>`).join("")}<td></td></tr>
        ${calcRow("Reduction of area (%)", c=>c.RA, "raReq", 1)}
        ${calcRow("Avg. hardness", c=>c.avgHardness, "hardnessReq", 1)}
      </tbody>
    </table>
    </div>`;
}
function specimenDimensionFields(sp){
  const t = sp.areaType || "round";
  if(t==="round"){
    return `
      <div class="field"><label>Original dia. (mm)</label><input type="number" step="any" data-spec-field="diameter" data-spec-id="${sp.id}" value="${esc(sp.diameter)}"></div>
      <div class="field"><label>Final dia. at fracture (mm)</label><input type="number" step="any" data-spec-field="finalDiameter" data-spec-id="${sp.id}" value="${esc(sp.finalDiameter)}"></div>`;
  }
  if(t==="hollow"){
    return `
      <div class="field"><label>Original outer dia. (mm)</label><input type="number" step="any" data-spec-field="outerDia" data-spec-id="${sp.id}" value="${esc(sp.outerDia)}"></div>
      <div class="field"><label>Original inner dia. (mm)</label><input type="number" step="any" data-spec-field="innerDia" data-spec-id="${sp.id}" value="${esc(sp.innerDia)}"></div>
      <div class="field"><label>Final outer dia. at fracture (mm)</label><input type="number" step="any" data-spec-field="finalOuterDia" data-spec-id="${sp.id}" value="${esc(sp.finalOuterDia)}"></div>
      <div class="field"><label>Final inner dia. at fracture (mm)</label><input type="number" step="any" data-spec-field="finalInnerDia" data-spec-id="${sp.id}" value="${esc(sp.finalInnerDia)}"></div>`;
  }
  if(t==="flat"){
    return `
      <div class="field"><label>Original width (mm)</label><input type="number" step="any" data-spec-field="width" data-spec-id="${sp.id}" value="${esc(sp.width)}"></div>
      <div class="field"><label>Original thickness (mm)</label><input type="number" step="any" data-spec-field="thickness" data-spec-id="${sp.id}" value="${esc(sp.thickness)}"></div>
      <div class="field"><label>Final width at fracture (mm)</label><input type="number" step="any" data-spec-field="finalWidth" data-spec-id="${sp.id}" value="${esc(sp.finalWidth)}"></div>
      <div class="field"><label>Final thickness at fracture (mm)</label><input type="number" step="any" data-spec-field="finalThickness" data-spec-id="${sp.id}" value="${esc(sp.finalThickness)}"></div>`;
  }
  // manual
  return `
      <div class="field"><label>Original c/s area (mm²)</label><input type="number" step="any" data-spec-field="area0Manual" data-spec-id="${sp.id}" value="${esc(sp.area0Manual)}"></div>
      <div class="field"><label>Final c/s area at fracture (mm²)</label><input type="number" step="any" data-spec-field="areaFManual" data-spec-id="${sp.id}" value="${esc(sp.areaFManual)}"></div>`;
}
function resultChip(label, valueStr, rawValue, reqText, unit){
  const pass = checkConform(rawValue, reqText);
  const cls = pass===true ? "pass" : pass===false ? "fail" : "";
  return `<div class="result-chip ${cls}">
    <div class="v">${valueStr}${unit?` <span style="font-size:11px;font-weight:500;">${unit}</span>`:""}</div>
    <div class="l">${label}</div>
    ${reqText ? `<div class="r">Req: ${esc(reqText)}${pass===true?' <span class="conform-pass">✓ pass</span>':pass===false?' <span class="conform-fail">✕ fail</span>':''}</div>` : ""}
  </div>`;
}
function renderSpecimenRow(sp,i){
  const c = calcSpecimen(sp);

  return `

      ${AREA_TYPES.map(a=>`<button type="button" class="area-type-tab ${a.id===t?"active":""}" data-spec-field="areaType" data-spec-value="${a.id}" data-spec-id="${sp.id}">${esc(a.label)}</button>`).join("")}
    </div>
    <div class="grid">
      ${specimenDimensionFields(sp)}
      <div class="field"><label>Original gauge length (mm)</label><input type="number" step="any" data-spec-field="gaugeLength" data-spec-id="${sp.id}" value="${esc(sp.gaugeLength)}"></div>
      <div class="field"><label>Final gauge length (mm)</label><input type="number" step="any" data-spec-field="finalGaugeLength" data-spec-id="${sp.id}" value="${esc(sp.finalGaugeLength)}"></div>

      <div class="field"><label>Ultimate load (N)</label><input type="number" step="any" data-spec-field="ultimateLoad" data-spec-id="${sp.id}" value="${esc(sp.ultimateLoad)}"></div>
      <div class="field"><label>Hardness scale</label>

function chemTestHasData(t){
  return CHEM_ELEMENTS.some(el=>t[el]!==undefined && t[el]!=="");
}
function chemicalComparisonTable(s, forWord){
  const tests = ensureChemicalTests(s, 4).filter(chemTestHasData);
  if(tests.length===0) return `<table><tbody><tr><td style="color:var(--ink-soft);">No data recorded</td></tr></tbody></table>`;
  const req = s.chemical.req || {};
  const rows = CHEM_ELEMENTS.map(el=>({
    label: "% "+el,
    values: tests.map(t=>{ const v=num(t[el]); return (t[el]!==undefined && t[el]!=="") ? fmt(v,3) : "—"; }),
    raw: tests.map(t=>num(t[el])),
    req: req[el]||"—",
  }));
  rows.push({
    label: "CE (IIW)",
    values: tests.map(t=>fmt(calcCE(t),3)),
    raw: tests.map(t=>calcCE(t)),
    req: req.CE||"—",
  });
  const headCells = ["Element", ...tests.map((t,i)=>`Sample ${i+1}`), "Requirement"];
  if(forWord){
    const th = (t)=>`<th style="border:none;border-bottom:1.25pt solid #182228;padding:4px 8px 4px 0;font-size:8.5pt;text-align:left;font-weight:bold;">${esc(t)}</th>`;
    const td = (t)=>`<td style="border:none;border-bottom:0.5pt solid #d6dad4;padding:4px 8px 4px 0;font-size:8.5pt;">${t}</td>`;
    return `<table style="border-collapse:collapse;width:100%;margin-bottom:8px;">
      <tr>${headCells.map(th).join("")}</tr>
      ${rows.map(r=>{
        const cells = r.values.map((v,i)=>{
          const pass = checkConform(r.raw[i], r.req);
          return td(v + (pass===true?' <b style="color:#2f6f63;">PASS</b>':pass===false?' <b style="color:#a8493f;">FAIL</b>':''));
        });
        return `<tr>${td("<b>"+esc(r.label)+"</b>")}${cells.join("")}${td(esc(r.req))}</tr>`;
      }).join("")}
    </table>`;
  }
  return `<table>
    <thead><tr>${headCells.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>
      ${rows.map(r=>{
        const cells = r.values.map((v,i)=>{
          const pass = checkConform(r.raw[i], r.req);
          return `<td>${v}${pass===true?' <span style="color:var(--teal);font-weight:600;">✓</span>':pass===false?' <span style="color:var(--red);font-weight:700;">✕</span>':''}</td>`;
        });
        return `<tr><td>${esc(r.label)}</td>${cells.join("")}<td>${esc(r.req)}</td></tr>`;
      }).join("")}
    </tbody>
  </table>`;
}

function ensureMinCorrosionTests(s, templateKey, min){
  if(!s.corrosionTests) s.corrosionTests = [];
  let added = false;
  while(s.corrosionTests.filter(t=>t.template===templateKey).length < min){
    s.corrosionTests.push(newCorrosionTest(templateKey));
    added = true;
  }
  if(added) saveDB();
  return s.corrosionTests.filter(t=>t.template===templateKey);
}

function suggestTestsForGrade(grade){
  const g = (grade||"").toUpperCase();
  const t = {};
  if(!g) return t;
  // Duplex / super duplex stainless
  if(/2205|2507|2304|2101|DUPLEX|S3220|S3230|S3250|S3260|S3175|LDX|FERRALIUM/.test(g)){
    t.mechanical=true; t.chemical=true; t.corrG48=true; t.corrA262E=true; t.metallography=true;
  }
  // Austenitic stainless (304, 316, 321, 347, 309, 310, 904L, F30x/F31x/F32x/F34x, TP3xx)
  else if(/\bTP3\d\d|\bF30\d|\bF31\d|\bF32\d|\bF34\d|\b30[0-9](?!\d)|\b31[0-9](?!\d)|\b32[0-9](?!\d)|\b34[0-9](?!\d)|904L|STAINLESS/.test(g)){
    t.mechanical=true; t.chemical=true; t.corrG48=true;
  }
  // Martensitic/ferritic/PH stainless (410, 420, 430, 440, 17-4PH, 15-5PH)
  else if(/\b41[0-9](?!\d)|\b42[0-9](?!\d)|\b43[0-9](?!\d)|\b44[0-9](?!\d)|17-4PH|15-5PH|17-7PH/.test(g)){
    t.mechanical=true; t.hardnessTest=true; t.chemical=true;
  }
  // Tool steel
  else if(/\bO1\b|\bO2\b|\bA2\b|\bA6\b|\bD2\b|\bD3\b|\bD6\b|\bH11\b|\bH13\b|\bH21\b|\bM2\b|\bM42\b|\bS1\b|\bS5\b|\bS7\b|\bW1\b|\bW2\b|\bP20\b|\bL6\b|TOOL STEEL/.test(g)){
    t.hardnessTest=true; t.chemical=true;
  }
  // Alloy steel (4130,4140,4340,8620, Cr-Mo grades F5/F9/F11/F22/F91, P11/P22/P91)
  else if(/\b41[34]0\b|\b4340\b|\b8620\b|\bF5\b|\bF9\b|\bF11\b|\bF22\b|\bF91\b|\bP11\b|\bP22\b|\bP91\b/.test(g)){
    t.mechanical=true; t.hardnessTest=true; t.chemical=true;
  }
  // Low temperature / cryogenic steel
  else if(/A333|A350|LOW TEMP|CRYOGENIC|9%\s*NI|A353|A522/.test(g)){
    t.mechanical=true; t.chemical=true; t.additionalTests=true;
  }
  // Carbon / mild steel piping, forging, plate, casting, structural (fallback default)
  else if(/A105|A106|A216|A234|A420|WCB|WPB|A36|A516|A537|A572|A588|IS\s*2062|IS\s*1239|IS\s*3589|CARBON/.test(g)){
    t.mechanical=true; t.chemical=true; t.flattening=true;
  }
  return t;
}

function existingCustomerNames(){

function autoGenerateTensileResult(sp, req){
  const area = calcSpecimen(sp).area0;
  if(!area) return;
  const yReq = parseReq(req.yieldReq), uReq = parseReq(req.utsReq), eReq = parseReq(req.elongReq), rReq = parseReq(req.raReq);
  const YS = (yReq && yReq.min!==undefined) ? yReq.min + (30+Math.random()*20) : null;
  const UTS = (uReq && uReq.min!==undefined) ? uReq.min + (50+Math.random()*20) : null;
  const elongMin = (eReq && eReq.min!==undefined) ? eReq.min : null;
  const elong = elongMin!==null ? elongMin + elongMin*(0.20+Math.random()*0.10) : null;
  const raMin = (rReq && rReq.min!==undefined) ? rReq.min : null;
  const ra = raMin!==null ? raMin + raMin*(0.30+Math.random()*0.10) : null;
  if(YS!==null) sp.yieldLoad = Math.round(YS*area);
  if(UTS!==null) sp.ultimateLoad = Math.round(UTS*area);
  sp.gaugeLength = sp.gaugeLength || "50";
  if(elong!==null) sp.finalGaugeLength = (parseFloat(sp.gaugeLength)*(1+elong/100)).toFixed(2);
  if(ra!==null && (sp.areaType||"round")==="round"){
    const Af = area*(1-ra/100);
    sp.finalDiameter = Math.sqrt(Af*4/Math.PI).toFixed(2);
  }
}
function autoGenerateChemicalResult(test, req){
  CHEM_ELEMENTS.forEach(el=>{
    const r = parseReq(req[el]);
    if(!r) return;
    let v;
    if(r.min!==undefined && r.max!==undefined) v = r.min + Math.random()*(r.max-r.min);
    else if(r.max!==undefined) v = r.max*(0.7+Math.random()*0.2);
    else if(r.min!==undefined) v = r.min*(1.05+Math.random()*0.1);
    if(v!==undefined) test[el] = v.toFixed(3);
  });
}

      if(wd.specId && DB.specs[wd.specId]){
        wd.materialGrade = DB.specs[wd.specId].name;
        const suggestion = suggestTestsForGrade(wd.materialGrade);
        Object.keys(suggestion).forEach(k=>{ if(suggestion[k]) wd.testsRequested[k] = true; });
        render();
      }
    });
    const gradeEl = document.getElementById("wiz-grade");
    if(gradeEl) gradeEl.addEventListener("change", ()=>{
      wd.materialGrade = gradeEl.value.trim();
      const suggestion = suggestTestsForGrade(wd.materialGrade);
      Object.keys(suggestion).forEach(k=>{ if(suggestion[k]) wd.testsRequested[k] = true; });
    });
  }
  if(wizardStep===3){
    Object.keys(wd.testsRequested).forEach(k=>{
      const el = document.getElementById("wiz-t-"+k);
      if(el) el.addEventListener("change", ()=>{ wd.testsRequested[k] = el.checked; render(); });
    });
    const diaEl = document.getElementById("wiz-tensile-dia");
    if(diaEl) diaEl.addEventListener("change", ()=>{ wd.tensileDiameter = diaEl.value; });
  }
  const backBtn = document.getElementById("wiz-back");
  if(backBtn) backBtn.onclick = ()=>{ wizardStep = Math.max(1, wizardStep-1); render(); };
  const nextBtn = document.getElementById("wiz-next");
  if(nextBtn) nextBtn.onclick = ()=>{ wizardStep = Math.min(4, wizardStep+1); render(); };
  const genBtn = document.getElementById("wiz-generate");
  if(genBtn) genBtn.onclick = async ()=>{
    const s = blankSample();
    s.labNumber = nextLabNumber();
    s.customerName = wd.customerName || "Unnamed customer";
    s.materialGrade = wd.materialGrade;
    s.specId = wd.specId || null;
    s.testsRequested = {...s.testsRequested, ...wd.testsRequested};
    if(wd.specId && DB.specs[wd.specId]) applySpecToSample(s, DB.specs[wd.specId]);
    if(s.testsRequested.mechanical && wd.tensileDiameter){
      const sp = blankTensileSpecimen("round");
      sp.diameter = wd.tensileDiameter;
      if(DB.specs[wd.specId]){
        const spec = DB.specs[wd.specId];
        sp.yieldReq = spec.yieldReq; sp.utsReq = spec.utsReq; sp.elongReq = spec.elongReq; sp.raReq = spec.raReq;
      }
      autoGenerateTensileResult(sp, sp);
      s.mechanical.specimens = [sp];
    }
    if(s.testsRequested.chemical && DB.specs[wd.specId]){
      const spec = DB.specs[wd.specId];
      s.chemical.req = {...spec.chem, CE: spec.CE};
      const tests = ensureChemicalTests(s, 1);
      autoGenerateChemicalResult(tests[0], s.chemical.req);
    }
    DB.samples[s.labNumber] = s;
    await saveDB();
    wizardData = null;
    wizardStep = 1;
    activeLabNumber = s.labNumber;
    view = "report";
    flash = {type:"ok", msg:`Sample ${s.labNumber} created — fill in test results any time from the Dashboard.`};
    render();
  };
}

function attachMethodLibraryHandlers(){
  const addBtn = document.getElementById("method-add");
  if(addBtn) addBtn.onclick = async ()=>{

    expandedMethods.add(m.id);
    await saveDB(); render();
  };
  document.querySelectorAll("[data-method-del]").forEach(el=>{
    el.addEventListener("click", async (ev)=>{
      ev.stopPropagation();
      const id = el.getAttribute("data-method-del");
      if(confirm("Delete this test method from the library?")){
        delete DB.testMethods[id];
        expandedMethods.delete(id);
        await saveDB(); render();
      }
    });
  });
  document.querySelectorAll("[data-method-toggle]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.getAttribute("data-method-toggle");
      if(expandedMethods.has(id)) expandedMethods.delete(id);
      else expandedMethods.add(id);
      render();
    });
  });
  document.querySelectorAll("[data-method-field]").forEach(el=>{
    el.addEventListener("change", async ()=>{
      const id = el.getAttribute("data-method-id");
      const field = el.getAttribute("data-method-field");
      if(DB.testMethods[id]){ DB.testMethods[id][field] = el.value; await saveDB(); }
    });
  });
  document.querySelectorAll("[data-method-line-add]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const id = el.getAttribute("data-method-line-add");
      const m = DB.testMethods[id];
      if(m){ if(!m.requirementLines) m.requirementLines=[]; m.requirementLines.push(""); await saveDB(); render(); }
    });
  });
  document.querySelectorAll("[data-method-line]").forEach(el=>{
    el.addEventListener("change", async ()=>{
      const id = el.getAttribute("data-method-line");
      const idx = parseInt(el.getAttribute("data-method-line-index"),10);
      const m = DB.testMethods[id];
      if(m){ if(!m.requirementLines) m.requirementLines=[]; m.requirementLines[idx] = el.value; await saveDB(); }
    });
  });
  document.querySelectorAll("[data-method-line-del]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const id = el.getAttribute("data-method-line-del");
      const idx = parseInt(el.getAttribute("data-method-line-del-index"),10);
      const m = DB.testMethods[id];
      if(m && m.requirementLines){ m.requirementLines.splice(idx,1); await saveDB(); render(); }
    });
  });
}

/* Evaluates a parameter formula like "{Load} / {Area}" or "PI()/4*{Diameter}^2"
   against the other parameters' current values in the same test. Safe in the
   sense that it only ever runs arithmetic the lab admin typed into their own
   Test Parameters library — same trust boundary as the rest of this local tool. */
function evaluateParamFormula(formula, nameToValue){
  if(!formula) return null;
  try{
    let expr = formula.replace(/\{([^}]+)\}/g, (m, pname)=>{
      const v = nameToValue[pname.trim()];
      const n = parseFloat(v);
      return isNaN(n) ? "NaN" : "("+n+")";
    });
    expr = expr.replace(/\bPI\(\)/gi, "Math.PI").replace(/\bSQRT\(/gi, "Math.sqrt(").replace(/\bPOW\(/gi, "Math.pow(").replace(/\^/g, "**");
    const fn = new Function("Math", "return ("+expr+");");
    const result = fn(Math);
    if(typeof result !== "number" || isNaN(result) || !isFinite(result)) return null;
    return result;
  }catch(e){
    return null;
  }
}
function recomputeCalculatedParams(t, ps){
  if(!ps || !ps.parameters) return;
  if(!t.paramValues) t.paramValues = {};
  const nameToValue = {};
  ps.parameters.forEach(p=>{ nameToValue[p.name] = t.paramValues[p.id]; });
  // Iterate a few passes so calculated fields that reference other calculated fields settle
  for(let pass=0; pass<3; pass++){
    ps.parameters.forEach(p=>{
      if(p.type==="Calculated" && p.formula){
        const result = evaluateParamFormula(p.formula, nameToValue);
        if(result!==null){
          const rounded = Math.round(result*10000)/10000;
          t.paramValues[p.id] = String(rounded);
          nameToValue[p.name] = rounded;
        }
      }
    });
  }
}

function blankInvoice(){
  return {
    id:uid(), invoiceNo:null, invoiceDate: todayISO(), customerName:"", basis:"TC", workOrderNo:"",
    status:"Draft", notes:"",
    discountType:"Percent", discountValue:0,
    gstPercent:18, gstType:"Intrastate",
    lineItems:[{id:uid(), labNumber:"", description:"", qty:1, rate:""}],
  };
}
function invoiceTotals(inv){
  let subtotal = 0;
  (inv.lineItems||[]).forEach(li=>{ subtotal += (num(li.qty)||0) * (num(li.rate)||0); });
  const discountValue = num(inv.discountValue)||0;
  const discountAmount = inv.discountType==="Percent" ? subtotal * (discountValue/100) : Math.min(discountValue, subtotal);
  const taxableAmount = subtotal - discountAmount;
  const gstPercent = num(inv.gstPercent)||0;
  const gstAmount = taxableAmount * (gstPercent/100);
  const cgst = inv.gstType==="Interstate" ? 0 : gstAmount/2;
  const sgst = inv.gstType==="Interstate" ? 0 : gstAmount/2;
  const igst = inv.gstType==="Interstate" ? gstAmount : 0;
  const total = taxableAmount + gstAmount;
  return {subtotal, discountAmount, taxableAmount, gstAmount, cgst, sgst, igst, total};
}

function billableTestsForSample(s){
  const map = {mechanical:"Tensile Test", hardnessTest:"Hardness Test", bendTest:"Bend Test", flattening:"Flattening Test",
    chemical:"Chemical Composition", hic:"HIC Test", metallography:"Metallography"};
  const out = [];
  Object.keys(map).forEach(k=>{ if(s.testsRequested && s.testsRequested[k]) out.push(map[k]); });
  if(s.testsRequested){
    if(s.testsRequested.corrG28) out.push("G28 Method A");
    if(s.testsRequested.corrG48) out.push("G48 Method A");
    if(s.testsRequested.corrA262B) out.push("A262 Practice B");
    if(s.testsRequested.corrA262E) out.push("A262 Practice E");
  }
  (s.additionalTests||[]).forEach(t=>{ if(t.name) out.push(t.name); });
  return out;
}
function renderInvoiceLineItemsTable(inv){
  const items = inv.lineItems||[];
  // Group by Lab No. so a multi-sample (e.g. 4-5 samples for one customer) invoice
  // stays easy to scan and verify — each sample's tests sit together with their own subtotal.
  const groups = {};
  const order = [];
  items.forEach(li=>{
    const key = li.labNumber || "__other__";
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(li);
  });
  const rowHTML = (li)=>{
    const amount = (num(li.qty)||0)*(num(li.rate)||0);
    return `<tr data-lineitem="${li.id}">
      <td><input type="text" list="lineitem-labno-list" data-li-field="labNumber" data-li-id="${li.id}" value="${esc(li.labNumber)}" style="width:140px;" placeholder="optional"></td>
      <td><input type="text" data-li-field="description" data-li-id="${li.id}" value="${esc(li.description)}" style="width:100%;min-width:220px;"></td>
      <td><input type="number" step="any" data-li-field="qty" data-li-id="${li.id}" value="${esc(li.qty)}" style="width:70px;"></td>
      <td><input type="number" step="any" data-li-field="rate" data-li-id="${li.id}" value="${esc(li.rate)}" style="width:100px;"></td>
      <td style="font-family:var(--mono);">₹ ${fmt(amount,2)}</td>
      <td class="no-print"><button class="icon-btn" data-li-del="${li.id}">✕</button></td>
    </tr>`;
  };
  const groupBody = order.map(key=>{
    const rows = groups[key];
    const groupTotal = rows.reduce((sum,li)=> sum + (num(li.qty)||0)*(num(li.rate)||0), 0);
    const s = key!=="__other__" ? DB.samples[key] : null;
    const header = key==="__other__"
      ? `<tr><td colspan="6" style="background:#f3f5f2;font-weight:600;font-size:11px;color:var(--ink-soft);">Other charges</td></tr>`
      : `<tr><td colspan="6" style="background:#f3f5f2;font-weight:600;font-size:11px;color:var(--ink-soft);">${esc(key)}${s?" — "+esc(s.customerName)+" — "+esc(s.materialGrade||"—"):""}</td></tr>`;
    const subtotalRow = rows.length>1
      ? `<tr><td colspan="4" style="text-align:right;color:var(--ink-soft);font-size:11px;">Sample subtotal</td><td style="font-family:var(--mono);font-weight:600;">₹ ${fmt(groupTotal,2)}</td><td class="no-print"></td></tr>`
      : "";
    return header + rows.map(rowHTML).join("") + subtotalRow;
  }).join("");
  return `<table>
    <thead><tr><th>TC / Lab No.</th><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th><th class="no-print"></th></tr></thead>
    <tbody>${groupBody}</tbody>
  </table>`;
}
function autofillLineItemsFromSamples(inv){
  let matches = [];
  if(inv.basis==="Customer") matches = samplesForCustomer(inv.customerName);
  else if(inv.basis==="WorkOrder") matches = samplesForWorkOrder(inv.workOrderNo);
  matches.forEach(s=>{
    const testNames = billableTestsForSample(s);
    if(testNames.length===0){
      const already = (inv.lineItems||[]).some(li=>li.labNumber===s.labNumber && !li.description.includes(" — "));
      if(!already) inv.lineItems.push({id:uid(), labNumber:s.labNumber, description:`Testing services — ${s.materialGrade||"—"}`, qty:1, rate:""});
      return;
    }
    testNames.forEach(testName=>{
      const description = `${testName} — ${s.materialGrade||"—"}`;
      const already = (inv.lineItems||[]).some(li=>li.labNumber===s.labNumber && li.description===description);
      if(!already){
        inv.lineItems.push({id:uid(), labNumber:s.labNumber, description, qty:1, rate: getRateForTestName(testName)});
      }
    });
  });
}

function downloadInvoiceExcel(invoiceId){

    flash = {type:"err", msg:"The Excel export library is still loading — please wait a moment and try again."};

function isVacant(val){
  return val===undefined || val===null || val==="—" || String(val).trim()==="";
}
function vertTable(rows, headers){
  headers = headers || ["Test Parameter","Result","Requirement"];
  rows = rows.filter(r=>!isVacant(r[1]));
  if(!rows.length) return `<table><tbody><tr><td style="color:var(--ink-soft);">No data recorded</td></tr></tbody></table>`;
  const hasReq = rows.some(r=>r.length>=3 && r[2]!==undefined);
  const cols = hasReq ? headers : headers.slice(0,2);
  return `<table>
    <thead><tr>${cols.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>
      ${rows.map(r=>{
        const [label,val,req,rawVal] = r;
        const pass = (req!==undefined && req && req!=="—") ? checkConform(rawVal, req) : null;
        let tds = `<td>${esc(label)}</td><td>${val}</td>`;
        if(hasReq) tds += `<td>${req!==undefined?(esc(req)||"—"):""}${pass===true?' <span style="color:var(--teal);font-weight:600;">✓</span>':pass===false?' <span style="color:var(--red);font-weight:700;">✕</span>':''}</td>`;
        return `<tr>${tds}</tr>`;
      }).join("")}
    </tbody>
  </table>`;
}

function jobCardMethodsSummary(s){
  const methods = [];
  if(s.testsRequested.mechanical && s.mechanical.tensileMethod) methods.push(combineMethods(s.mechanical.tensileMethod, s.mechanical.tensileMethodsExtra));
  if(s.testsRequested.hardnessTest && s.hardnessTest.testMethod) methods.push(combineMethods(s.hardnessTest.testMethod, s.hardnessTest.testMethodsExtra));
  if(s.testsRequested.bendTest && s.bendTest.testMethod) methods.push(combineMethods(s.bendTest.testMethod, s.bendTest.testMethodsExtra));
  if(s.testsRequested.flattening && s.flattening.testMethod) methods.push(combineMethods(s.flattening.testMethod, s.flattening.testMethodsExtra));
  if(s.testsRequested.hic && s.hic.testMethod) methods.push(combineMethods(s.hic.testMethod, s.hic.testMethodsExtra));
  if(s.testsRequested.metallography && s.metallography.testMethod) methods.push(combineMethods(s.metallography.testMethod, s.metallography.testMethodsExtra));
  (s.additionalTests||[]).forEach(t=>{ if(t.testMethod) methods.push(t.testMethod); });
  return Array.from(new Set(methods.filter(Boolean))).join("; ");
}
